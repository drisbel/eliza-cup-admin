<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Eliza Cup Admin</title>


<style>

:root {

  --black:
    #000000;

  --panel:
    #0a0a0a;

  --line:
    #242424;

  --text:
    #eeeeee;

  --muted:
    #888888;

  --yellow:
    #ffdd00;

  --d1:
    #28427c;

  --d2a:
    #bc3532;

  --d2b:
    #990000;

  --d3a:
    #6aa84f;

  --d3b:
    #274e13;

  --waitlist:
    #4b4b4b;

  --infill:
    #806f00;

  --notplaying:
    #3b3b3b;

}


* {
  box-sizing:
    border-box;
}


html,
body {

  margin:
    0;

  background:
    var(--black);

  color:
    var(--text);

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

}


button,
input,
select,
textarea {
  font: inherit;
}


button {
  cursor: pointer;
}


/************************************************************
 * HEADER
 ************************************************************/

.topbar {

  position:
    sticky;

  top:
    0;

  z-index:
    100;

  background:
    rgba(
      0,
      0,
      0,
      .97
    );

  border-bottom:
    2px solid
    var(--yellow);

}


.topbar-inner {

  max-width:
    1900px;

  margin:
    auto;

  padding:
    9px 12px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    12px;

}


.brand-title {

  color:
    var(--yellow);

  font-size:
    21px;

  font-weight:
    950;

}


.brand-subtitle {

  margin-top:
    2px;

  color:
    #777;

  font-size:
    10px;

}


.actions {

  display:
    flex;

  align-items:
    center;

  flex-wrap:
    wrap;

  gap:
    6px;

}


.btn {

  padding:
    7px 10px;

  border:
    1px solid
    #333;

  border-radius:
    6px;

  background:
    #111;

  color:
    #eee;

  font-size:
    10px;

  font-weight:
    800;

}


.btn:hover {

  border-color:
    var(--yellow);

}


.btn-primary {

  border-color:
    var(--yellow);

  background:
    var(--yellow);

  color:
    #000;

  font-weight:
    950;

}


.btn:disabled {

  opacity:
    .4;

  cursor:
    not-allowed;

}


.unsaved {

  display:
    none;

  padding:
    5px 8px;

  border:
    1px solid
    #6c5f00;

  border-radius:
    999px;

  background:
    #211d00;

  color:
    var(--yellow);

  font-size:
    9px;

  font-weight:
    900;

}


.unsaved.show {
  display: inline-block;
}


/************************************************************
 * PAGE
 ************************************************************/

.page {

  max-width:
    1900px;

  margin:
    auto;

  padding:
    10px 10px 30px;

}


.toolbar {

  display:
    flex;

  align-items:
    center;

  gap:
    8px;

  margin-bottom:
    8px;

}


.search {

  flex:
    1;

  min-width:
    180px;

  padding:
    8px 9px;

  border:
    1px solid
    #333;

  border-radius:
    6px;

  background:
    #080808;

  color:
    white;

  font-size:
    10px;

}


.search:focus {

  outline:
    none;

  border-color:
    var(--yellow);

}


.status {

  color:
    #777;

  font-size:
    9px;

  white-space:
    nowrap;

}


/************************************************************
 * ERRORS
 ************************************************************/

.error {

  display:
    none;

  margin-bottom:
    8px;

  padding:
    10px;

  border:
    1px solid
    #650000;

  border-radius:
    6px;

  background:
    #260000;

  color:
    #ffaaaa;

  font-size:
    10px;

}


.error.show {
  display: block;
}


/************************************************************
 * DIVISIONS
 ************************************************************/

.stack {

  display:
    flex;

  flex-direction:
    column;

  gap:
    8px;

}


.division {

  overflow:
    hidden;

  border:
    1px solid
    #202020;

  border-radius:
    7px;

  background:
    var(--panel);

}


.division-header {

  min-height:
    35px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  padding:
    6px 10px;

  background:
    var(--division-colour);

  color:
    white;

}


.division-name {

  display:
    flex;

  align-items:
    center;

  gap:
    8px;

  font-size:
    13px;

  font-weight:
    950;

}


.count {

  padding:
    2px 7px;

  border:
    1px solid
    rgba(
      255,
      255,
      255,
      .4
    );

  border-radius:
    999px;

  background:
    rgba(
      0,
      0,
      0,
      .22
    );

  font-size:
    9px;

  font-weight:
    900;

}


.count.over {

  background:
    #000;

  color:
    #ff7777;

}


/************************************************************
 * DIVISION COLOURS
 ************************************************************/

.division[
  data-division="DIVISION 1"
] {

  --division-colour:
    var(--d1);

}


.division[
  data-division="DIVISION 2A"
] {

  --division-colour:
    var(--d2a);

}


.division[
  data-division="DIVISION 2B"
] {

  --division-colour:
    var(--d2b);

}


.division[
  data-division="DIVISION 3A"
] {

  --division-colour:
    var(--d3a);

}


.division[
  data-division="DIVISION 3B"
] {

  --division-colour:
    var(--d3b);

}


.division[
  data-division="WAITLIST"
] {

  --division-colour:
    var(--waitlist);

}


.division[
  data-division="INFILL"
] {

  --division-colour:
    var(--infill);

}


.division[
  data-division="NOT RETURNING"
] {

  --division-colour:
    var(--notplaying);

}


/************************************************************
 * TABLE
 ************************************************************/

.table-wrap {
  width: 100%;
}


table {

  width:
    100%;

  border-collapse:
    collapse;

  table-layout:
    fixed;

}


th {

  padding:
    5px 3px;

  border-bottom:
    1px solid
    #252525;

  background:
    #050505;

  color:
    #888;

  text-align:
    left;

  text-transform:
    uppercase;

  font-size:
    7.5px;

  font-weight:
    900;

}


td {

  height:
    32px;

  padding:
    3px;

  border-bottom:
    1px solid
    #171717;

  vertical-align:
    middle;

  font-size:
    9px;

}


tbody tr:last-child td {
  border-bottom: none;
}


tbody tr:hover {
  background: #101010;
}


tbody tr.dragging {
  opacity: .3;
}


tbody.drag-over {

  outline:
    2px dashed
    var(--yellow);

  outline-offset:
    -2px;

  background:
    rgba(
      255,
      221,
      0,
      .05
    );

}


/************************************************************
 * COLUMNS
 ************************************************************/

.col-drag {
  width: 1.7%;
}


.col-id {
  width: 3.6%;
}


.col-team {
  width: 19%;
}


.col-manager {
  width: 8%;
}


.col-prevdiv {
  width: 6%;
}


.col-prevpos {
  width: 5.5%;
}


.col-overall {
  width: 4.5%;
}


.col-intention {
  width: 7%;
}


.col-comments {
  width: 20%;
}


.col-contact {
  width: 13%;
}


.col-move {
  width: 11.7%;
}


/************************************************************
 * CELLS
 ************************************************************/

.drag-handle {

  cursor:
    grab;

  color:
    #666;

  font-size:
    13px;

  text-align:
    center;

  user-select:
    none;

}


.team-name {

  overflow:
    hidden;

  color:
    #fff;

  font-size:
    12px;

  font-weight:
    900;

  white-space:
    nowrap;

  text-overflow:
    ellipsis;

}


.readonly {

  overflow:
    hidden;

  color:
    #bfbfbf;

  white-space:
    nowrap;

  text-overflow:
    ellipsis;

}


/************************************************************
 * INPUTS
 ************************************************************/

.field {

  width:
    100%;

  min-height:
    25px;

  padding:
    3px 5px;

  border:
    1px solid
    #282828;

  border-radius:
    4px;

  background:
    #080808;

  color:
    #ddd;

  font-size:
    8.5px;

}


.field:focus {

  outline:
    none;

  border-color:
    var(--yellow);

}


textarea.field {

  height:
    25px;

  resize:
    vertical;

  line-height:
    16px;

}


.confirmed {
  color: #98e69e;
}


.likely {
  color: #ffe873;
}


.unlikely {
  color: #ff9393;
}


/************************************************************
 * LOADING
 ************************************************************/

.loading {

  padding:
    45px;

  color:
    #777;

  text-align:
    center;

}


/************************************************************
 * MODAL
 ************************************************************/

.modal-backdrop {

  position:
    fixed;

  inset:
    0;

  z-index:
    500;

  display:
    none;

  align-items:
    center;

  justify-content:
    center;

  padding:
    15px;

  background:
    rgba(
      0,
      0,
      0,
      .82
    );

}


.modal-backdrop.show {
  display: flex;
}


.modal {

  width:
    min(
      500px,
      100%
    );

  padding:
    17px;

  border:
    1px solid
    #333;

  border-top:
    4px solid
    var(--yellow);

  border-radius:
    9px;

  background:
    #0d0d0d;

}


.modal h2 {

  margin:
    0 0 14px;

  color:
    var(--yellow);

  font-size:
    17px;

}


.form-row {
  margin-bottom: 9px;
}


.form-row label {

  display:
    block;

  margin-bottom:
    3px;

  color:
    #888;

  font-size:
    8px;

  font-weight:
    900;

  text-transform:
    uppercase;

}


.form-control {

  width:
    100%;

  padding:
    8px;

  border:
    1px solid
    #333;

  border-radius:
    5px;

  background:
    #050505;

  color:
    white;

  font-size:
    10px;

}


.form-control:focus {

  outline:
    none;

  border-color:
    var(--yellow);

}


.modal-actions {

  display:
    flex;

  justify-content:
    flex-end;

  gap:
    6px;

  margin-top:
    13px;

}


/************************************************************
 * TOAST
 ************************************************************/

.toast {

  position:
    fixed;

  right:
    14px;

  bottom:
    14px;

  z-index:
    800;

  padding:
    9px 12px;

  border:
    1px solid
    #444;

  border-left:
    4px solid
    var(--yellow);

  border-radius:
    6px;

  background:
    #111;

  color:
    var(--yellow);

  font-size:
    9px;

  font-weight:
    900;

  opacity:
    0;

  transform:
    translateY(
      10px
    );

  transition:
    .18s;

  pointer-events:
    none;

}


.toast.show {

  opacity:
    1;

  transform:
    translateY(
      0
    );

}


/************************************************************
 * RESPONSIVE
 ************************************************************/

@media (
  max-width: 1050px
) {

  .table-wrap {
    overflow-x: auto;
  }


  table {
    min-width: 1150px;
  }

}


@media (
  max-width: 700px
) {

  .topbar-inner {

    flex-direction:
      column;

    align-items:
      stretch;

  }


  .page {
    padding: 7px;
  }


  .toolbar {

    align-items:
      stretch;

    flex-direction:
      column;

  }

}



/************************************************************
 * VIEW SWITCH / SCHEDULE PLANNER
 ************************************************************/

.schedule-view[hidden] {
  display: none !important;
}

.schedule-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
  padding: 9px 10px;
  border: 1px solid #242424;
  border-radius: 7px;
  background: #090909;
}

.schedule-title {
  color: var(--yellow);
  font-size: 16px;
  font-weight: 950;
}

.schedule-subtitle {
  margin-top: 2px;
  color: #999;
  font-size: 10px;
}

.schedule-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}

.schedule-warning-summary {
  margin-bottom: 8px;
  padding: 9px 11px;
  border: 1px solid #8a7100;
  border-radius: 6px;
  background: #2a2300;
  color: #ffe47a;
  font-size: 10.5px;
  font-weight: 850;
  text-align: center;
}

.schedule-table-wrap {
  width: 100%;
  overflow-x: auto;
  border: 1px solid #242424;
  border-radius: 7px;
  background: #080808;
}

.schedule-table {
  width: 100%;
  min-width: 860px;
  border-collapse: collapse;
  table-layout: fixed;
}

.schedule-table th {
  position: sticky;
  top: 0;
  z-index: 2;
  padding: 7px 4px;
  background: #050505;
  color: #bdbdbd;
  border-bottom: 2px solid var(--yellow);
  text-align: center;
  vertical-align: middle;
  font-size: 9.5px;
  font-weight: 950;
  letter-spacing: .2px;
}

.schedule-table td {
  padding: 3px;
  border-bottom: 1px solid #1b1b1b;
  border-right: 1px solid #141414;
  vertical-align: middle;
  text-align: center;
}

.schedule-table td:last-child,
.schedule-table th:last-child {
  border-right: 0;
}

.schedule-table tbody tr:hover td {
  background-color: rgba(255,255,255,.025);
}

.schedule-table tr:last-child td {
  border-bottom: 0;
}

.schedule-round {
  width: 48px;
  text-align: center !important;
  color: var(--yellow);
  font-size: 11px;
  font-weight: 950;
}

.schedule-date {
  width: 86px;
  text-align: center !important;
}

.schedule-week-type {
  width: 82px;
  text-align: center !important;
}

.schedule-stage {
  width: 116px;
  text-align: center !important;
}

.schedule-field {
  width: 100%;
  min-height: 30px;
  padding: 4px 5px;
  border: 1px solid #303030;
  border-radius: 5px;
  background: #0b0b0b;
  color: #f0f0f0;
  font-size: 10.5px;
  font-weight: 800;
  text-align: center;
  text-align-last: center;
}

.schedule-field:focus {
  outline: none;
  border-color: var(--yellow);
  box-shadow: 0 0 0 1px rgba(255,221,0,.18);
}

/* Week type colouring */
.schedule-field.week-normal {
  background: #111;
  color: #d5d5d5;
}

.schedule-field.week-double {
  background: #5b4700;
  border-color: #9e7a00;
  color: #fff0a8;
}

.schedule-field.week-bye {
  background: #571b1b;
  border-color: #8c3030;
  color: #ffd0d0;
}

.schedule-row-double > td:first-child {
  background: #4a3a00;
}

.schedule-row-bye > td:first-child {
  background: #4b1717;
}

/* Stage colouring */
.schedule-field.stage-empty {
  background: #242424;
  border-color: #333;
  color: #8d8d8d;
}

.schedule-field.stage-eliza {
  background: #1d315f;
  border-color: #38548f;
  color: #e9f0ff;
}

.schedule-field.stage-div2 {
  background: #5c1f1d;
  border-color: #8d3531;
  color: #ffe4e3;
}

.schedule-field.stage-div3 {
  background: #204116;
  border-color: #38672a;
  color: #e5f7df;
}

.schedule-field.stage-fa {
  background: #5a3900;
  border-color: #8b5a05;
  color: #ffe3a8;
}

.schedule-field.stage-ecl {
  background: #3c285d;
  border-color: #624492;
  color: #eee2ff;
}

.schedule-field.stage-playoff,
.schedule-field.stage-final {
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
  font-weight: 950;
}

.schedule-clash {
  background: #302800 !important;
  outline: 1px solid #957900;
  outline-offset: -1px;
}

.schedule-cell-warning {
  display: block;
  margin-top: 3px;
  color: #ffd95a;
  font-size: 8px;
  font-weight: 900;
  line-height: 1.15;
  text-align: center;
}

.schedule-legend {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 6px;
  margin: 7px 0;
  color: #999;
  font-size: 9.5px;
}

.schedule-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 3px 7px;
  border: 1px solid #333;
  border-radius: 999px;
  background: #0a0a0a;
}

.schedule-pill-normal { border-color: #444; }
.schedule-pill-double { border-color: #8f7000; color: #ffe47a; background: #292100; }
.schedule-pill-bye { border-color: #843131; color: #ffb7b7; background: #2b1111; }
.schedule-pill-warning { border-color: #8f7000; color: #ffe47a; }

@media (max-width: 700px) {
  .schedule-toolbar {
    align-items: stretch;
    flex-direction: column;
  }

  .schedule-actions {
    width: 100%;
  }

  .schedule-table {
    min-width: 860px;
  }
}

</style>

</head>


<body>


<header class="topbar">

  <div class="topbar-inner">

    <div>

      <div class="brand-title">
        ELIZA CUP ADMIN
      </div>

      <div class="brand-subtitle">
        2026/27 Team Management
      </div>

    </div>


    <div class="actions">

      <button
        id="teamsViewBtn"
        class="btn btn-primary"
        type="button"
      >
        Teams
      </button>

      <button
        id="scheduleViewBtn"
        class="btn"
        type="button"
      >
        Schedule Planner
      </button>

      <span
        id="unsaved"
        class="unsaved"
      >
        UNSAVED CHANGES
      </span>


      <button
        id="addTeamBtn"
        class="btn btn-primary"
      >
        + Add Team
      </button>


      <button
        id="undoBtn"
        class="btn"
        disabled
      >
        Undo
      </button>


      <button
        id="discardBtn"
        class="btn"
        disabled
      >
        Discard
      </button>


      <button
        id="refreshBtn"
        class="btn"
      >
        Refresh
      </button>


      <button
        id="saveBtn"
        class="btn btn-primary"
        disabled
      >
        Save Changes
      </button>

    </div>

  </div>

</header>


<main class="page">


  <div
    id="error"
    class="error"
  ></div>


  <section id="teamView">

    <div class="toolbar">

      <input
        id="search"
        class="search"
        placeholder="Search team, manager, ID, position, comments..."
      >


      <div
        id="status"
        class="status"
      >
        Loading...
      </div>

    </div>


    <div id="content">

      <div class="loading">
        Loading teams...
      </div>

    </div>

  </section>


  <section
    id="scheduleView"
    class="schedule-view"
    hidden
  >

    <div class="schedule-toolbar">

      <div>
        <div class="schedule-title">Schedule Planner</div>
        <div class="schedule-subtitle">Competition stage by A-League round. Double and Bye clashes are warnings only.</div>
      </div>

      <div class="schedule-actions">
        <span id="scheduleUnsaved" class="unsaved">UNSAVED SCHEDULE</span>
        <button id="scheduleDiscardBtn" class="btn" type="button" disabled>Discard</button>
        <button id="scheduleRefreshBtn" class="btn" type="button">Refresh</button>
        <button id="scheduleSaveBtn" class="btn btn-primary" type="button" disabled>Save Schedule</button>
      </div>

    </div>

    <div id="scheduleWarningSummary" class="schedule-warning-summary" hidden></div>

    <div id="scheduleContent">
      <div class="loading">Loading schedule...</div>
    </div>

  </section>


</main>


<div
  id="addModal"
  class="modal-backdrop"
>

  <div class="modal">


    <h2>
      Add Team
    </h2>


    <div class="form-row">

      <label>
        Team Name
      </label>

      <input
        id="newTeam"
        class="form-control"
      >

    </div>


    <div class="form-row">

      <label>
        Manager
      </label>

      <input
        id="newManager"
        class="form-control"
      >

    </div>


    <div class="form-row">

      <label>
        Destination
      </label>

      <select
        id="newDivision"
        class="form-control"
      ></select>

    </div>


    <div class="form-row">

      <label>
        Intention
      </label>

      <select
        id="newIntention"
        class="form-control"
      >

        <option value=""></option>

        <option value="CONFIRMED">
          CONFIRMED
        </option>

        <option value="LIKELY">
          LIKELY
        </option>

        <option value="UNLIKELY">
          UNLIKELY
        </option>

      </select>

/*

async function assertBackendVersion() {
  const response = await fetch(

function normaliseId(
  value
) {

  const text =
    String(
      value || ''
    ).trim();


  if (!text) {
    return '';
  }


  if (
    /^\d+$/.test(
      text
    )
  ) {

    return String(
      parseInt(
        text,
        10
      )
    ).padStart(
      3,
      '0'
    );

  }


  return text;

}

        /\s+/g,

/************************************************************

function validateTeamState(
  list
) {

  const seen =
    new Set();


  list.forEach(
    team => {


      if (!team.id) {

        throw new Error(
          'A team has no ELIZA ID.'
        );

      }


      if (
        seen.has(
          team.id
        )
      ) {

        throw new Error(
          'Duplicate ELIZA ID: ' +
          team.id
        );

      }


      seen.add(
        team.id
      );


      if (
        !DIVISIONS.some(
          division =>
            division.key ===
            normaliseDivision(
              team.division
            )
        )
      ) {

        throw new Error(
          'Unknown division for ' +
          team.id +
          ': ' +
          team.division
        );

      }

    }
  );

}

/************************************************************
 * MOVE
 *
 * Team is NEVER removed from teams[].
 * Only division/order are changed.
 ************************************************************/

function moveTeam(
  id,
  newDivision,
  beforeId = null
) {

  id =
    normaliseId(
      id
    );


  newDivision =
    normaliseDivision(
      newDivision
    );


  if (
    !DIVISIONS.some(
      division =>
        division.key ===
        newDivision
    )
  ) {

    setError(
      'Invalid destination: ' +
      newDivision
    );

    return;

  }


  const team =
    teams.find(
      item =>
        item.id ===
        id
    );


  if (!team) {

    setError(
      'Could not find team ' +
      id
    );

    return;

  }


  const oldDivision =
    team.division;


  if (
    oldDivision ===
    newDivision &&
    !beforeId
  ) {

    return;

  }


  pushUndo();


  /*
   * Change ONLY the destination.
   */

  team.division =
    newDivision;


  /*
   * Rebuild target division order.
   */

  const destinationTeams =
    teams
      .filter(
        item =>
          item.id !==
          id &&
          normaliseDivision(
            item.division
          ) ===
          newDivision
      )
      .sort(
        (a,b) =>
          Number(
            a.order || 999
          ) -
          Number(
            b.order || 999
          )
      );


  let insertIndex =
    destinationTeams.length;


  if (
    beforeId
  ) {

    const targetId =
      normaliseId(
        beforeId
      );


    const targetIndex =
      destinationTeams
        .findIndex(
          item =>
            item.id ===
            targetId
        );


    if (
      targetIndex !==
      -1
    ) {

      insertIndex =
        targetIndex;

    }

  }


  destinationTeams.splice(

    insertIndex,

    0,

    team

  );


  destinationTeams.forEach(
    (item,index) => {

      item.order =
        index + 1;

    }
  );


  reindexDivision(
    oldDivision
  );


  validateTeamState(
    teams
  );


  render();


  updateControls();

}


/************************************************************
 * DRAG DROP
 ************************************************************/

function attachDrag() {


  document
    .querySelectorAll(
      'tr[data-team-id]'
    )
    .forEach(
      row => {


        row.addEventListener(
          'dragstart',
          event => {


            draggedId =
              normaliseId(
                row.dataset.teamId
              );


            row.classList.add(
              'dragging'
            );


            event
              .dataTransfer
              .setData(
                'text/plain',
                draggedId
              );


            event.dataTransfer.effectAllowed =
              'move';

          }
        );


        row.addEventListener(
          'dragend',
          () => {


            draggedId =
              null;


            row.classList.remove(
              'dragging'
            );


            document
              .querySelectorAll(
                'tbody.drag-over'
              )
              .forEach(
                body =>
                  body.classList.remove(
                    'drag-over'
                  )
              );

          }
        );

      }
    );


  document
    .querySelectorAll(
      'tbody[data-division]'
    )
    .forEach(
      body => {


        body.addEventListener(
          'dragover',
          event => {


            event.preventDefault();


            event.dataTransfer.dropEffect =
              'move';


            body.classList.add(
              'drag-over'
            );

          }
        );


        body.addEventListener(
          'dragleave',
          event => {


            if (
              body.contains(
                event.relatedTarget
              )
            ) {
              return;
            }


            body.classList.remove(
              'drag-over'
            );

          }
        );


        body.addEventListener(
          'drop',
          event => {


            event.preventDefault();


            body.classList.remove(
              'drag-over'
            );


            const id =
              normaliseId(

                draggedId ||

                event
                  .dataTransfer
                  .getData(
                    'text/plain'
                  )

              );


            if (!id) {
              return;
            }


            const target =
              event.target.closest(
                'tr[data-team-id]'
              );


            moveTeam(

              id,

              body.dataset.division,

              target
                ? target.dataset.teamId
                : null

            );

          }
        );

      }
    );

}

/************************************************************
 * SAVE
 ************************************************************/

async function saveChanges() {

  if (
    !hasChanges() ||
    saving
  ) {

    return;

  }


  setError(
    ''
  );


  /*
   * Validate before sending anything.
   */

  try {

    validateTeamState(
      teams
    );

  } catch (err) {

    setError(
      err.message
    );

    return;

  }


  saving =
    true;


  updateControls();


  status.textContent =
    'Saving...';


  try {

    /*
     * Refuse to save if the /exec deployment is not the exact
     * backend version that contains the atomic row-save fix.
     */
    await assertBackendVersion();


    const payload = {

      action:
        'saveTeams',


      /*
       * Sending full list is fine,
       * but backend STILL merges safely.
       */

      teams:
        teams.map(
          team => ({


            id:
              normaliseId(
                team.id
              ),


            division:
              normaliseDivision(
                team.division
              ),


            order:
              Number(
                team.order
              ) || 999,


            intention:
              team.intention,


            comments:
              team.comments,


            contact:
              team.contact

          })
        )

    };


    await fetch(
      API_URL,
      {

        method:
          'POST',

        mode:
          'no-cors',

        headers: {

          'Content-Type':
            'text/plain;charset=utf-8'

        },

        body:
          JSON.stringify(
            payload
          )

      }
    );


    /*
     * Apps Script no-cors response cannot
     * be inspected, so re-read database.
     */

    await sleep(
      1200
    );


    const response =
      await fetch(

        API_URL +
        '?action=getTeams&_=' +
        Date.now()

      );


    const data =
      await response.json();


    if (
      !data.success
    ) {

      throw new Error(
        data.error ||
        'Save verification failed.'
      );

    }


    const fresh =
      normaliseTeams(
        data.teams
      );


    validateTeamState(
      fresh
    );


    /*
     * Critical client-side integrity check.
     *
     * A save must never reduce total team count.
     */

    if (
      fresh.length <
      originalTeams.length
    ) {

      throw new Error(

        'Safety check failed: database returned fewer teams after saving.'

      );

    }


    teams =
      fresh;


    originalTeams =
      clone(
        fresh
      );


    undoStack =
      [];


    render();


    updateControls();


    status.textContent =
      teams.length +
      ' teams';


    showToast(
      'Changes saved safely'
    );


  } catch (err) {


    console.error(
      err
    );


    setError(
      'Save failed: ' +
      err.message
    );


    status.textContent =
      'Save failed';


  } finally {


    saving =
      false;


    updateControls();

  }

}

/************************************************************
 * SCHEDULE LOAD / RENDER
 ************************************************************/

async function loadSchedule() {

  setError('');


  scheduleContent.innerHTML =
    '<div class="loading">Loading schedule...</div>';


  try {

    await assertBackendVersion();


    const response =
      await fetch(
        API_URL +
        '?action=getSchedule&_=' +
        Date.now()
      );


    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }


    const data =
      await response.json();


    if (!data.success) {
      throw new Error(data.error || 'Unable to load schedule.');
    }


    schedule =
      normaliseSchedule(data.schedule);


    originalSchedule =
      clone(schedule);


    renderSchedule();


    updateScheduleControls();

  } catch (err) {

    console.error(err);

    setError(
      'Unable to load schedule: ' +
      err.message
    );

    scheduleContent.innerHTML =
      '<div class="loading">Schedule load failed.</div>';

  }

}


function normaliseSchedule(list) {

  return (list || [])
    .map(item => ({

      round:
        Number(item.round),

      date:
        String(item.date || '').trim(),

      weekType:
        WEEK_TYPES.includes(
          String(item.weekType || '').trim().toUpperCase()
        )
          ? String(item.weekType).trim().toUpperCase()
          : 'NORMAL',

      elizaCup:
        String(item.elizaCup || '').trim(),

      division2:
        String(item.division2 || '').trim(),

      division3:
        String(item.division3 || '').trim(),

      faCup:
        String(item.faCup || '').trim(),

      ecl:
        String(item.ecl || '').trim()

    }))
    .filter(item => Number.isInteger(item.round) && item.round > 0)
    .sort((a,b) => a.round - b.round);

}


function scheduleOptions(field,current) {

  const options =
    [...(SCHEDULE_OPTIONS[field] || [])];


  if (
    current &&
    !options.includes(current)
  ) {
    options.push(current);
  }


  return options
    .map(value => `
      <option
        value="${escapeHtml(value)}"
        ${value === current ? 'selected' : ''}
      >
        ${escapeHtml(value || '—')}
      </option>
    `)
    .join('');

}


function scheduleHasClash(item) {

  return (
    item.weekType === 'DOUBLE' ||
    item.weekType === 'BYE'
  ) && (
    !!item.faCup ||
    !!item.ecl
  );

}


function renderSchedule() {

  const warnings =
    schedule.filter(scheduleHasClash);


  scheduleWarningSummary.hidden =
    warnings.length === 0;


  scheduleWarningSummary.textContent =
    warnings.length
      ? '⚠ ' + warnings.length +
        ' round' + (warnings.length === 1 ? '' : 's') +
        ' schedule FA Cup or ECL during a Double/Bye week. This is allowed, but should be reviewed.'
      : '';


  const rows =
    schedule.map(item => {

      const riskyWeek =
        item.weekType === 'DOUBLE' ||
        item.weekType === 'BYE';


      const rowClass =
        item.weekType === 'DOUBLE'
          ? 'schedule-row-double'
          : item.weekType === 'BYE'
            ? 'schedule-row-bye'
            : '';


      const faClash =
        riskyWeek && !!item.faCup;


      const eclClash =
        riskyWeek && !!item.ecl;


      return `
        <tr class="${rowClass}" data-round="${item.round}">

          <td class="schedule-round">${item.round}</td>

          <td class="schedule-date">
            <input
              class="schedule-field schedule-edit"
              data-round="${item.round}"
              data-field="date"
              value="${escapeHtml(item.date)}"
            >
          </td>

          <td class="schedule-week-type">
            <select
              class="schedule-field schedule-edit ${weekTypeClass(item.weekType)}"
              data-round="${item.round}"
              data-field="weekType"
            >
              ${WEEK_TYPES.map(value => `
                <option value="${value}" ${value === item.weekType ? 'selected' : ''}>
                  ${value}
                </option>
              `).join('')}
            </select>
          </td>

          ${buildScheduleStageCell(item,'elizaCup',false)}
          ${buildScheduleStageCell(item,'division2',false)}
          ${buildScheduleStageCell(item,'division3',false)}
          ${buildScheduleStageCell(item,'faCup',faClash)}
          ${buildScheduleStageCell(item,'ecl',eclClash)}

        </tr>
      `;

    }).join('');


  scheduleContent.innerHTML = `

    <div class="schedule-legend">
      <span class="schedule-pill schedule-pill-normal">NORMAL</span>
      <span class="schedule-pill schedule-pill-double">DOUBLE</span>
      <span class="schedule-pill schedule-pill-bye">BYE</span>
      <span class="schedule-pill schedule-pill-warning">⚠ FA Cup/ECL warnings only</span>
    </div>

    <div class="schedule-table-wrap">
      <table class="schedule-table">
        <thead>
          <tr>
            <th class="schedule-round">Round</th>
            <th class="schedule-date">Date</th>
            <th class="schedule-week-type">Week Type</th>
            <th class="schedule-stage">Eliza Cup</th>
            <th class="schedule-stage">Division 2</th>
            <th class="schedule-stage">Division 3</th>
            <th class="schedule-stage">FA Cup</th>
            <th class="schedule-stage">ECL</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;


  document
    .querySelectorAll('.schedule-edit')
    .forEach(control => {

      control.addEventListener('change', () => {

        const round =
          Number(control.dataset.round);

        const field =
          control.dataset.field;

        const item =
          schedule.find(row => row.round === round);

        if (!item) return;

        item[field] =
          control.value;

        renderSchedule();
        updateScheduleControls();

      });

    });

}


function weekTypeClass(value) {

  const text =
    String(value || '').trim().toUpperCase();

  if (text === 'DOUBLE') return 'week-double';
  if (text === 'BYE') return 'week-bye';
  return 'week-normal';

}


function scheduleStageClass(field,value) {

  const text =
    String(value || '').trim().toUpperCase();

  if (!text || text === '-' || text === '—' || text === 'NO H2H') {
    return 'stage-empty';
  }

  const competitionClass = {
    elizaCup: 'stage-eliza',
    division2: 'stage-div2',
    division3: 'stage-div3',
    faCup: 'stage-fa',
    ecl: 'stage-ecl'
  }[field] || '';

  const emphasis =
    text.includes('FINAL')
      ? ' stage-final'
      : text.includes('PLAYOFF')
        ? ' stage-playoff'
        : '';

  return competitionClass + emphasis;

}


function buildScheduleStageCell(item,field,warning) {

  const labels = {
    elizaCup: 'Eliza Cup',
    division2: 'Division 2',
    division3: 'Division 3',
    faCup: 'FA Cup',
    ecl: 'ECL'
  };


  return `
    <td class="schedule-stage ${warning ? 'schedule-clash' : ''}">
      <select
        class="schedule-field schedule-edit ${scheduleStageClass(field,item[field])}"
        data-round="${item.round}"
        data-field="${field}"
        aria-label="${labels[field]} round ${item.round}"
      >
        ${scheduleOptions(field,item[field])}
      </select>
      ${warning
        ? '<span class="schedule-cell-warning">⚠ Scheduled on ' + escapeHtml(item.weekType) + ' week</span>'
        : ''}
    </td>
  `;

}


function scheduleComparable(list) {

  return normaliseSchedule(list)
    .map(item => ({
      round:item.round,
      date:item.date,
      weekType:item.weekType,
      elizaCup:item.elizaCup,
      division2:item.division2,
      division3:item.division3,
      faCup:item.faCup,
      ecl:item.ecl
    }));

}


function scheduleHasChanges() {

  return JSON.stringify(scheduleComparable(schedule)) !==
    JSON.stringify(scheduleComparable(originalSchedule));

}


function updateScheduleControls() {

  const changed =
    scheduleHasChanges();


  scheduleSaveBtn.disabled =
    !changed || scheduleSaving;


  scheduleDiscardBtn.disabled =
    !changed || scheduleSaving;


  scheduleRefreshBtn.disabled =
    scheduleSaving;


  scheduleUnsaved.classList.toggle(
    'show',
    changed
  );

}


function discardSchedule() {

  if (!scheduleHasChanges()) return;


  if (!confirm('Discard all unsaved schedule changes?')) return;


  schedule =
    clone(originalSchedule);


  renderSchedule();
  updateScheduleControls();

}


async function saveSchedule() {

  if (
    !scheduleHasChanges() ||
    scheduleSaving
  ) {
    return;
  }


  scheduleSaving =
    true;


  updateScheduleControls();
  setError('');


  try {

    await assertBackendVersion();


    await fetch(
      API_URL,
      {
        method:'POST',
        mode:'no-cors',
        headers:{
          'Content-Type':'text/plain;charset=utf-8'
        },
        body:JSON.stringify({
          action:'saveSchedule',
          schedule:scheduleComparable(schedule)
        })
      }
    );


    await sleep(900);


    const response =
      await fetch(
        API_URL +
        '?action=getSchedule&_=' +
        Date.now()
      );


    const data =
      await response.json();


    if (!data.success) {
      throw new Error(data.error || 'Schedule verification failed.');
    }


    const fresh =
      normaliseSchedule(data.schedule);


    if (
      fresh.length !==
      originalSchedule.length
    ) {
      throw new Error('Schedule safety check failed: round count changed after save.');
    }


    schedule =
      fresh;


    originalSchedule =
      clone(fresh);


    renderSchedule();
    updateScheduleControls();
    showToast('Schedule saved');

  } catch (err) {

    console.error(err);
    setError('Schedule save failed: ' + err.message);

  } finally {

    scheduleSaving =
      false;

    updateScheduleControls();

  }

}


/************************************************************
 * UNSAVED STATE
 ************************************************************/

function comparable(
  list
) {

  return list
    .map(
      team => ({


        id:
          normaliseId(
            team.id
          ),


        division:
          normaliseDivision(
            team.division
          ),


        order:
          Number(
            team.order
          ),


        intention:
          team.intention,


        comments:
          team.comments,


        contact:
          team.contact

      })
    )
    .sort(
      (a,b) =>
        a.id.localeCompare(
          b.id
        )
    );

}


function hasChanges() {

  return (
    JSON.stringify(
      comparable(
        teams
      )
    ) !==
    JSON.stringify(
      comparable(
        originalTeams
      )
    )
  );

}


function updateControls() {

  const changed =
    hasChanges();


  saveBtn.disabled =
    !changed ||
    saving;


  discardBtn.disabled =
    !changed ||
    saving;


  undoBtn.disabled =
    !undoStack.length ||
    saving;


  refreshBtn.disabled =
    saving;


  addTeamBtn.disabled =
    saving;


  unsaved.classList.toggle(
    'show',
    changed
  );

}


/************************************************************
 * UNDO
 ************************************************************/

function pushUndo() {

  undoStack.push(
    clone(
      teams
    )
  );


  /*
   * Don't keep unlimited history.
   */

  if (
    undoStack.length >
    50
  ) {

    undoStack.shift();

  }

}


function undo() {

  if (
    !undoStack.length
  ) {
    return;
  }


  teams =
    undoStack.pop();


  validateTeamState(
    teams
  );


  render();


  updateControls();

}


/************************************************************
 * DISCARD
 ************************************************************/

function discard() {

  if (
    !hasChanges()
  ) {

    return;

  }


  if (
    !confirm(
      'Discard all unsaved changes?'
    )
  ) {

    return;

  }


  teams =
    clone(
      originalTeams
    );


  undoStack =
    [];


  render();


  updateControls();

}


/************************************************************
 * DIVISION HELPERS
 ************************************************************/

function getDivisionTeams(
  division
) {

  division =
    normaliseDivision(
      division
    );


  return teams
    .filter(
      team =>
        normaliseDivision(
          team.division
        ) ===
        division
    )
    .sort(
      (a,b) =>
        Number(
          a.order || 999
        ) -
        Number(
          b.order || 999
        )
    );

}


function reindexDivision(
  division
) {

  division =
    normaliseDivision(
      division
    );


  getDivisionTeams(
    division
  )
    .forEach(
      (team,index) => {

        team.order =
          index + 1;

      }
    );

}


/************************************************************
 * SORT
 ************************************************************/

function sortTeams(
  a,
  b
) {

  const aDivision =
    normaliseDivision(
      a.division
    );


  const bDivision =
    normaliseDivision(
      b.division
    );


  let da =
    DIVISIONS.findIndex(
      division =>
        division.key ===
        aDivision
    );


  let db =
    DIVISIONS.findIndex(
      division =>
        division.key ===
        bDivision
    );


  if (
    da === -1
  ) {
    da = 999;
  }


  if (
    db === -1
  ) {
    db = 999;
  }


  if (
    da !== db
  ) {

    return (
      da -
      db
    );

  }


  return (
    Number(
      a.order || 999
    ) -
    Number(
      b.order || 999
    )
  );

}


/************************************************************
 * INTENTION COLOUR
 ************************************************************/

function intentionClass(
  value
) {

  const text =
    String(
      value || ''
    ).toUpperCase();


  if (
    text ===
    'CONFIRMED'
  ) {

    return 'confirmed';

  }


  if (
    text ===
    'LIKELY'
  ) {

    return 'likely';

  }


  if (
    text ===
    'UNLIKELY'
  ) {

    return 'unlikely';

  }


  return '';

}


/************************************************************
 * HELPERS
 ************************************************************/

function clone(
  value
) {

  return JSON.parse(
    JSON.stringify(
      value
    )
  );

}


function sleep(
  ms
) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


function escapeHtml(
  value
) {

  return String(
    value ?? ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


function setError(
  message
) {

  error.textContent =
    message;


  error.classList.toggle(
    'show',
    !!message
  );

}


let toastTimer;


function showToast(
  message
) {

  clearTimeout(
    toastTimer
  );


  toast.textContent =
    message;


  toast.classList.add(
    'show'
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          'show'
        );

      },
      2200
    );

}

  () => {

    loadSchedule();
  }
);
