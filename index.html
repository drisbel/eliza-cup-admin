<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eliza Cup Admin</title>

  <style>
    :root {
      --bg: #0b1220;
      --panel: #121a2b;
      --panel-2: #182235;
      --line: rgba(255,255,255,.09);
      --text: #f5f7fb;
      --muted: #9eabc2;
      --accent: #4f7cff;
      --accent-2: #2f5fe8;
      --success: #1fa971;
      --warning: #d89b2b;
      --danger: #d9534f;
      --shadow: 0 12px 30px rgba(0,0,0,.22);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11,18,32,.97);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      max-width: 1900px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      justify-content: space-between;
    }

    .brand-title {
      font-weight: 800;
      font-size: 20px;
    }

    .brand-subtitle {
      margin-top: 2px;
      font-size: 12px;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 9px;
      font-weight: 700;
      transition: .15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.18);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-2);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: .45;
      transform: none;
    }

    .unsaved-pill {
      display: none;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(216,155,43,.13);
      color: #ffd98b;
      border: 1px solid rgba(216,155,43,.3);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .unsaved-pill.show {
      display: inline-flex;
    }

    .page {
      max-width: 1900px;
      margin: 0 auto;
      padding: 20px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .search-wrap {
      flex: 1;
      min-width: 240px;
    }

    .search {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      padding: 11px 13px;
      outline: none;
    }

    .search:focus {
      border-color: rgba(79,124,255,.75);
      box-shadow: 0 0 0 3px rgba(79,124,255,.12);
    }

    .status-line {
      font-size: 12px;
      color: var(--muted);
      margin-left: auto;
    }

    .division-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .division-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .division-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 13px 15px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.025);
    }

    .division-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .division-title h2 {
      margin: 0;
      font-size: 14px;
      letter-spacing: .4px;
    }

    .count-pill {
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.045);
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
    }

    .count-pill.over {
      color: #ffb3b3;
      border-color: rgba(217,83,79,.4);
      background: rgba(217,83,79,.12);
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 1550px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 9px 8px;
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .65px;
      font-weight: 800;
      text-align: left;
      border-bottom: 1px solid var(--line);
      background: #121a2b;
    }

    tbody tr {
      border-bottom: 1px solid rgba(255,255,255,.055);
      transition: background .12s ease;
    }

    tbody tr:last-child {
      border-bottom: 0;
    }

    tbody tr:hover {
      background: rgba(255,255,255,.025);
    }

    tbody tr.dragging {
      opacity: .35;
    }

    tbody.drag-over {
      background: rgba(79,124,255,.06);
      outline: 2px dashed rgba(79,124,255,.4);
      outline-offset: -4px;
    }

    td {
      padding: 8px;
      vertical-align: middle;
      font-size: 12px;
    }

    .drag-col {
      width: 34px;
      text-align: center;
      color: var(--muted);
    }

    .drag-handle {
      cursor: grab;
      user-select: none;
      font-size: 16px;
      line-height: 1;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .id-col {
      width: 72px;
    }

    .team-col {
      width: 220px;
    }

    .manager-col {
      width: 135px;
    }

    .previous-col {
      width: 115px;
    }

    .overall-col {
      width: 80px;
    }

    .conference-col {
      width: 150px;
    }

    .intention-col {
      width: 130px;
    }

    .comments-col {
      width: 280px;
    }

    .contact-col {
      width: 190px;
    }

    .move-col {
      width: 130px;
    }

    .team-name {
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .read-only {
      color: #d7deeb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .muted {
      color: var(--muted);
    }

    .field,
    .field-select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #101827;
      color: var(--text);
      padding: 7px 8px;
      outline: none;
    }

    .field:focus,
    .field-select:focus {
      border-color: rgba(79,124,255,.75);
      box-shadow: 0 0 0 2px rgba(79,124,255,.1);
    }

    textarea.field {
      resize: vertical;
      min-height: 34px;
      max-height: 110px;
      line-height: 1.25;
    }

    .intention-confirmed {
      border-color: rgba(31,169,113,.35);
      color: #98e9c1;
    }

    .intention-likely {
      border-color: rgba(79,124,255,.35);
      color: #b5c9ff;
    }

    .intention-unlikely {
      border-color: rgba(217,83,79,.4);
      color: #ffc0bd;
    }

    .empty-row {
      padding: 24px !important;
      color: var(--muted);
      text-align: center;
      font-size: 11px;
    }

    .loading {
      padding: 80px 20px;
      text-align: center;
      color: var(--muted);
    }

    .error-panel {
      display: none;
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 12px;
      border: 1px solid rgba(217,83,79,.35);
      background: rgba(217,83,79,.08);
      color: #ffc3c1;
      font-size: 13px;
      line-height: 1.5;
    }

    .error-panel.show {
      display: block;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 999;
      background: #1a2537;
      color: white;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 14px;
      box-shadow: var(--shadow);
      font-size: 12px;
      font-weight: 700;
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.success {
      border-color: rgba(31,169,113,.35);
    }

    .toast.error {
      border-color: rgba(217,83,79,.4);
    }

    .footer-note {
      margin-top: 18px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 900px) {
      .topbar-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .header-actions {
        width: 100%;
        justify-content: flex-start;
      }

      .page {
        padding: 12px;
      }

      .toolbar {
        align-items: stretch;
      }

      .status-line {
        width: 100%;
        margin-left: 0;
      }

      table {
        min-width: 1450px;
      }
    }
  </style>
</head>

<body>
  <div class="app-shell">

    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-title">Eliza Cup Admin</div>
          <div class="brand-subtitle">2026/27 Team & Division Management</div>
        </div>

        <div class="header-actions">
          <span id="unsavedPill" class="unsaved-pill">
            UNSAVED CHANGES
          </span>

          <button id="undoBtn" class="btn" disabled>
            Undo
          </button>

          <button id="discardBtn" class="btn" disabled>
            Discard
          </button>

          <button id="refreshBtn" class="btn">
            Refresh
          </button>

          <button id="saveBtn" class="btn btn-primary" disabled>
            Save Changes
          </button>
        </div>
      </div>
    </header>

    <main class="page">

      <div id="errorPanel" class="error-panel"></div>

      <div class="toolbar">
        <div class="search-wrap">
          <input
            id="searchInput"
            class="search"
            type="search"
            placeholder="Search team, manager, ID, comments or contact..."
            autocomplete="off"
          />
        </div>

        <div id="statusLine" class="status-line">
          Loading teams...
        </div>
      </div>

      <div id="content">
        <div class="loading">Loading Eliza Cup teams...</div>
      </div>

      <div class="footer-note">
        Drag rows between divisions or use the Move dropdown.
      </div>

    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const API_URL =
      'https://script.google.com/macros/s/AKfycbweLNRiMQMu1nMlvKMTsJmur_NrMU688qqWaxzxR2qMMWUVS6FXcuaZvDpfZJoeXdrB/exec';

    const DIVISIONS = [
      { key: 'DIVISION 1', label: 'Division 1', capacity: 14 },
      { key: 'DIVISION 2A', label: 'Division 2A', capacity: 12 },
      { key: 'DIVISION 2B', label: 'Division 2B', capacity: 12 },
      { key: 'DIVISION 3A', label: 'Division 3A', capacity: 12 },
      { key: 'DIVISION 3B', label: 'Division 3B', capacity: 12 },
      { key: 'WAITLIST', label: 'Waitlist', capacity: null },
      { key: 'INFILL', label: 'Infill', capacity: null }
    ];

    const CONFERENCE_OPTIONS = [
      '',
      'DIVISION 1',
      'DIVISION 2A',
      'DIVISION 2B',
      'DIVISION 3A',
      'DIVISION 3B',
      'WAITLIST',
      'INFILL'
    ];

    const INTENTION_OPTIONS = [
      '',
      'CONFIRMED',
      'LIKELY',
      'UNLIKELY'
    ];

    let teams = [];
    let originalTeams = [];
    let undoStack = [];
    let isSaving = false;
    let draggedTeamId = null;

    const content = document.getElementById('content');
    const searchInput = document.getElementById('searchInput');
    const refreshBtn = document.getElementById('refreshBtn');
    const saveBtn = document.getElementById('saveBtn');
    const undoBtn = document.getElementById('undoBtn');
    const discardBtn = document.getElementById('discardBtn');
    const unsavedPill = document.getElementById('unsavedPill');
    const statusLine = document.getElementById('statusLine');
    const errorPanel = document.getElementById('errorPanel');
    const toast = document.getElementById('toast');

    async function loadTeams() {
      setError('');
      content.innerHTML =
        '<div class="loading">Loading Eliza Cup teams...</div>';

      statusLine.textContent = 'Loading teams...';

      try {
        const response = await fetch(
          API_URL + '?action=getTeams&_=' + Date.now()
        );

        if (!response.ok) {
          throw new Error('API returned HTTP ' + response.status);
        }

        const data = await response.json();

        if (!data.success) {
          throw new Error(data.error || 'Unable to load team data.');
        }

        teams = normaliseTeamList(data.teams || []);
        originalTeams = deepClone(teams);
        undoStack = [];

        render();
        updateControls();

        statusLine.textContent =
          teams.length + ' teams loaded';

      } catch (error) {
        console.error(error);

        setError(
          'Could not load the Eliza Cup Admin data. ' +
          'Make sure the Apps Script deployment is updated to the latest version. ' +
          'Error: ' + error.message
        );

        content.innerHTML =
          '<div class="loading">Unable to load teams.</div>';

        statusLine.textContent = 'Load failed';
      }
    }

    function normaliseTeamList(list) {
      return list
        .map(item => ({
          id: String(item.id || '').trim(),
          team: String(item.team || '').trim(),
          manager: String(item.manager || '').trim(),
          division: String(item.division || '').trim(),
          order: Number(item.order) || 999,
          conference: String(item.conference || '').trim(),
          intention: String(item.intention || '').trim(),
          previousDivision:
            String(item.previousDivision || '').trim(),
          overall: String(item.overall || '').trim(),
          comments: String(item.comments || '').trim(),
          contact: String(item.contact || '').trim()
        }))
        .sort(sortTeams);
    }

    function render() {
      const query =
        searchInput.value.trim().toLowerCase();

      const wrapper = document.createElement('div');
      wrapper.className = 'division-stack';

      DIVISIONS.forEach(div => {
        const allDivisionTeams = getDivisionTeams(div.key);

        const filteredTeams = allDivisionTeams.filter(team => {
          if (!query) return true;

          return [
            team.id,
            team.team,
            team.manager,
            team.division,
            team.conference,
            team.intention,
            team.previousDivision,
            team.overall,
            team.comments,
            team.contact
          ]
            .join(' ')
            .toLowerCase()
            .includes(query);
        });

        const card = document.createElement('section');
        card.className = 'division-card';

        const overCapacity =
          div.capacity !== null &&
          allDivisionTeams.length > div.capacity;

        const countText =
          div.capacity === null
            ? allDivisionTeams.length
            : allDivisionTeams.length + ' / ' + div.capacity;

        card.innerHTML = `
          <div class="division-header">
            <div class="division-title">
              <h2>${escapeHtml(div.label)}</h2>
              <span class="count-pill ${overCapacity ? 'over' : ''}">
                ${countText}
              </span>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="drag-col"></th>
                  <th class="id-col">ID</th>
                  <th class="team-col">Team</th>
                  <th class="manager-col">Manager</th>
                  <th class="previous-col">Previous</th>
                  <th class="overall-col">Overall</th>
                  <th class="conference-col">26/27 Conference</th>
                  <th class="intention-col">Intention</th>
                  <th class="comments-col">Comments</th>
                  <th class="contact-col">Contact</th>
                  <th class="move-col">Move</th>
                </tr>
              </thead>

              <tbody data-division="${escapeHtml(div.key)}">
                ${buildRows(filteredTeams)}
              </tbody>
            </table>
          </div>
        `;

        wrapper.appendChild(card);
      });

      content.innerHTML = '';
      content.appendChild(wrapper);

      attachDragHandlers();
      attachMoveHandlers();
      attachEditableHandlers();
    }

    function buildRows(list) {
      if (!list.length) {
        return `
          <tr>
            <td colspan="11" class="empty-row">
              No teams
            </td>
          </tr>
        `;
      }

      return list.map(team => `
        <tr draggable="true" data-team-id="${escapeHtml(team.id)}">

          <td class="drag-col">
            <span class="drag-handle" title="Drag">⋮⋮</span>
          </td>

          <td class="id-col read-only">
            ${escapeHtml(team.id || '—')}
          </td>

          <td class="team-col">
            <div class="team-name">
              ${escapeHtml(team.team || team.manager || 'Unnamed Team')}
            </div>
          </td>

          <td class="manager-col read-only">
            ${escapeHtml(team.manager || '—')}
          </td>

          <td class="previous-col read-only">
            ${escapeHtml(team.previousDivision || '—')}
          </td>

          <td class="overall-col read-only">
            ${escapeHtml(team.overall || '—')}
          </td>

          <td class="conference-col">
            <select
              class="field-select conference-input"
              data-team-id="${escapeHtml(team.id)}"
            >
              ${buildOptions(CONFERENCE_OPTIONS, team.conference)}
            </select>
          </td>

          <td class="intention-col">
            <select
              class="field-select intention-input ${intentionClass(team.intention)}"
              data-team-id="${escapeHtml(team.id)}"
            >
              ${buildOptions(INTENTION_OPTIONS, team.intention)}
            </select>
          </td>

          <td class="comments-col">
            <textarea
              class="field comments-input"
              data-team-id="${escapeHtml(team.id)}"
              rows="1"
            >${escapeHtml(team.comments)}</textarea>
          </td>

          <td class="contact-col">
            <input
              class="field contact-input"
              data-team-id="${escapeHtml(team.id)}"
              type="text"
              value="${escapeHtml(team.contact)}"
            />
          </td>

          <td class="move-col">
            <select
              class="field-select move-select"
              data-team-id="${escapeHtml(team.id)}"
            >
              ${buildDivisionOptions(team.division)}
            </select>
          </td>

        </tr>
      `).join('');
    }

    function buildOptions(options, currentValue) {
      const hasCurrent =
        currentValue &&
        !options.includes(currentValue);

      const combined =
        hasCurrent
          ? [...options, currentValue]
          : options;

      return combined.map(option => `
        <option
          value="${escapeHtml(option)}"
          ${option === currentValue ? 'selected' : ''}
        >
          ${escapeHtml(option || '—')}
        </option>
      `).join('');
    }

    function buildDivisionOptions(currentDivision) {
      return DIVISIONS.map(div => `
        <option
          value="${escapeHtml(div.key)}"
          ${div.key === currentDivision ? 'selected' : ''}
        >
          ${escapeHtml(div.label)}
        </option>
      `).join('');
    }

    function intentionClass(value) {
      const upper = String(value || '').toUpperCase();

      if (upper === 'CONFIRMED') return 'intention-confirmed';
      if (upper === 'LIKELY') return 'intention-likely';
      if (upper === 'UNLIKELY') return 'intention-unlikely';

      return '';
    }

    function attachEditableHandlers() {
      document.querySelectorAll('.conference-input').forEach(input => {
        input.addEventListener('change', () => {
          updateTeamField(
            input.dataset.teamId,
            'conference',
            input.value
          );
        });
      });

      document.querySelectorAll('.intention-input').forEach(input => {
        input.addEventListener('change', () => {
          updateTeamField(
            input.dataset.teamId,
            'intention',
            input.value
          );

          input.classList.remove(
            'intention-confirmed',
            'intention-likely',
            'intention-unlikely'
          );

          const css = intentionClass(input.value);
          if (css) input.classList.add(css);
        });
      });

      document.querySelectorAll('.comments-input').forEach(input => {
        input.addEventListener('input', () => {
          updateTeamField(
            input.dataset.teamId,
            'comments',
            input.value,
            false
          );
        });
      });

      document.querySelectorAll('.contact-input').forEach(input => {
        input.addEventListener('input', () => {
          updateTeamField(
            input.dataset.teamId,
            'contact',
            input.value,
            false
          );
        });
      });
    }

    function updateTeamField(teamId, field, value, rerender = false) {
      const team = teams.find(item => item.id === teamId);

      if (!team) return;

      if (team[field] === value) return;

      const beforeSnapshot = deepClone(teams);

      team[field] = value;

      undoStack.push(beforeSnapshot);

      if (rerender) {
        render();
      }

      updateControls();
    }

    function attachMoveHandlers() {
      document.querySelectorAll('.move-select').forEach(select => {
        select.addEventListener('change', () => {
          moveTeam(
            select.dataset.teamId,
            select.value,
            null
          );
        });
      });
    }

    function attachDragHandlers() {
      document
        .querySelectorAll('tbody tr[data-team-id]')
        .forEach(row => {

          row.addEventListener('dragstart', event => {
            draggedTeamId = row.dataset.teamId;
            row.classList.add('dragging');

            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData(
              'text/plain',
              draggedTeamId
            );
          });

          row.addEventListener('dragend', () => {
            draggedTeamId = null;
            row.classList.remove('dragging');

            document.querySelectorAll('tbody').forEach(body =>
              body.classList.remove('drag-over')
            );
          });
        });

      document
        .querySelectorAll('tbody[data-division]')
        .forEach(body => {

          body.addEventListener('dragover', event => {
            event.preventDefault();
            body.classList.add('drag-over');
          });

          body.addEventListener('dragleave', event => {
            if (!body.contains(event.relatedTarget)) {
              body.classList.remove('drag-over');
            }
          });

          body.addEventListener('drop', event => {
            event.preventDefault();
            body.classList.remove('drag-over');

            const teamId =
              draggedTeamId ||
              event.dataTransfer.getData('text/plain');

            const division = body.dataset.division;

            if (!teamId || !division) return;

            const targetRow =
              event.target.closest('tr[data-team-id]');

            const targetTeamId =
              targetRow ? targetRow.dataset.teamId : null;

            moveTeam(teamId, division, targetTeamId);
          });
        });
    }

    function moveTeam(teamId, newDivision, beforeTeamId) {
      const team = teams.find(item => item.id === teamId);

      if (!team) return;

      const beforeSnapshot = deepClone(teams);
      const oldDivision = team.division;

      if (oldDivision === newDivision && !beforeTeamId) {
        return;
      }

      team.division = newDivision;

      const divisionTeams = teams
        .filter(item =>
          item.division === newDivision &&
          item.id !== teamId
        )
        .sort(sortTeams);

      let insertIndex = divisionTeams.length;

      if (beforeTeamId) {
        const foundIndex = divisionTeams.findIndex(
          item => item.id === beforeTeamId
        );

        if (foundIndex !== -1) {
          insertIndex = foundIndex;
        }
      }

      divisionTeams.splice(insertIndex, 0, team);

      divisionTeams.forEach((item, index) => {
        item.order = index + 1;
      });

      if (oldDivision !== newDivision) {
        reindexDivision(oldDivision);
      }

      undoStack.push(beforeSnapshot);

      render();
      updateControls();

      showToast(
        (team.team || team.manager || 'Team') +
        ' moved to ' +
        displayDivision(newDivision)
      );
    }

    function reindexDivision(division) {
      const list = teams
        .filter(team => team.division === division)
        .sort(sortTeams);

      list.forEach((team, index) => {
        team.order = index + 1;
      });
    }

    function undoLast() {
      if (!undoStack.length) return;

      teams = undoStack.pop();

      render();
      updateControls();

      showToast('Last change undone');
    }

    function discardChanges() {
      if (!hasChanges()) return;

      const okay = confirm(
        'Discard all unsaved changes?'
      );

      if (!okay) return;

      teams = deepClone(originalTeams);
      undoStack = [];

      render();
      updateControls();

      showToast('Changes discarded');
    }

    async function saveChanges() {
      if (!hasChanges() || isSaving) return;

      isSaving = true;
      updateControls();

      statusLine.textContent = 'Saving changes...';

      try {
        const payload = {
          action: 'saveTeams',
          teams: teams.map(team => ({
            id: team.id,
            division: team.division,
            order: team.order,
            conference: team.conference,
            intention: team.intention,
            comments: team.comments,
            contact: team.contact
          }))
        };

        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(payload)
        });

        await sleep(1000);

        const verifyResponse = await fetch(
          API_URL + '?action=getTeams&_=' + Date.now()
        );

        const verifyData = await verifyResponse.json();

        if (!verifyData.success) {
          throw new Error(
            verifyData.error ||
            'Save verification failed.'
          );
        }

        const serverTeams =
          normaliseTeamList(verifyData.teams || []);

        if (!sameTeamState(teams, serverTeams)) {
          throw new Error(
            'The save was sent, but the stored data does not match the portal yet.'
          );
        }

        teams = serverTeams;
        originalTeams = deepClone(serverTeams);
        undoStack = [];

        render();
        updateControls();

        statusLine.textContent =
          teams.length + ' teams loaded';

        showToast(
          'Changes saved successfully',
          'success'
        );

      } catch (error) {
        console.error(error);

        setError(
          'The changes could not be confirmed as saved. ' +
          error.message
        );

        statusLine.textContent = 'Save failed';

        showToast('Save failed', 'error');

      } finally {
        isSaving = false;
        updateControls();
      }
    }

    function hasChanges() {
      return !sameTeamState(
        teams,
        originalTeams
      );
    }

    function sameTeamState(listA, listB) {
      const cleanA = comparableList(listA);
      const cleanB = comparableList(listB);

      return JSON.stringify(cleanA) === JSON.stringify(cleanB);
    }

    function comparableList(list) {
      return list
        .map(team => ({
          id: team.id,
          division: team.division,
          order: Number(team.order),
          conference: team.conference || '',
          intention: team.intention || '',
          comments: team.comments || '',
          contact: team.contact || ''
        }))
        .sort((a, b) =>
          a.id.localeCompare(b.id)
        );
    }

    function updateControls() {
      const changed = hasChanges();

      saveBtn.disabled =
        !changed || isSaving;

      discardBtn.disabled =
        !changed || isSaving;

      undoBtn.disabled =
        !undoStack.length || isSaving;

      refreshBtn.disabled =
        isSaving;

      unsavedPill.classList.toggle(
        'show',
        changed
      );

      if (changed) {
        const count = countChangedTeams();

        unsavedPill.textContent =
          count +
          (count === 1
            ? ' UNSAVED CHANGE'
            : ' UNSAVED CHANGES');
      }
    }

    function countChangedTeams() {
      const originalMap = {};

      originalTeams.forEach(team => {
        originalMap[team.id] =
          JSON.stringify({
            division: team.division,
            order: Number(team.order),
            conference: team.conference || '',
            intention: team.intention || '',
            comments: team.comments || '',
            contact: team.contact || ''
          });
      });

      return teams.filter(team => {
        const current = JSON.stringify({
          division: team.division,
          order: Number(team.order),
          conference: team.conference || '',
          intention: team.intention || '',
          comments: team.comments || '',
          contact: team.contact || ''
        });

        return originalMap[team.id] !== current;
      }).length;
    }

    function getDivisionTeams(division) {
      return teams
        .filter(team => team.division === division)
        .sort(sortTeams);
    }

    function sortTeams(a, b) {
      const divA = DIVISIONS.findIndex(
        div => div.key === a.division
      );

      const divB = DIVISIONS.findIndex(
        div => div.key === b.division
      );

      if (divA !== divB) {
        return divA - divB;
      }

      const orderA = Number(a.order) || 999;
      const orderB = Number(b.order) || 999;

      if (orderA !== orderB) {
        return orderA - orderB;
      }

      return String(a.team)
        .localeCompare(String(b.team));
    }

    function displayDivision(key) {
      const found = DIVISIONS.find(
        div => div.key === key
      );

      return found ? found.label : key;
    }

    function deepClone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function sleep(ms) {
      return new Promise(resolve =>
        setTimeout(resolve, ms)
      );
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function setError(message) {
      if (!message) {
        errorPanel.textContent = '';
        errorPanel.classList.remove('show');
        return;
      }

      errorPanel.textContent = message;
      errorPanel.classList.add('show');
    }

    let toastTimer = null;

    function showToast(message, type = '') {
      clearTimeout(toastTimer);

      toast.textContent = message;
      toast.className = 'toast';

      if (type) {
        toast.classList.add(type);
      }

      requestAnimationFrame(() => {
        toast.classList.add('show');
      });

      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    searchInput.addEventListener('input', render);

    refreshBtn.addEventListener('click', () => {
      if (hasChanges()) {
        const okay = confirm(
          'Refresh and discard unsaved changes?'
        );

        if (!okay) return;
      }

      loadTeams();
    });

    undoBtn.addEventListener('click', undoLast);
    discardBtn.addEventListener('click', discardChanges);
    saveBtn.addEventListener('click', saveChanges);

    window.addEventListener('beforeunload', event => {
      if (!hasChanges()) return;

      event.preventDefault();
      event.returnValue = '';
    });

    loadTeams();
  </script>
</body>
</html>
