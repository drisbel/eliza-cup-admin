<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>
<title>Eliza Cup Admin</title>

<style>
:root {
  --bg: #000000;
  --panel: #0b0b0b;
  --panel2: #131313;
  --line: #282828;

  --text: #f4f4f4;
  --muted: #888;

  --yellow: #ffdd00;
  --yellow-dark: #bda400;

  --d1: #28427c;
  --d2a: #bc3532;
  --d2b: #990000;
  --d3a: #6aa84f;
  --d3b: #274e13;

  --waitlist: #555;
  --infill: #8b7400;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

/* HEADER */

.topbar {
  position: sticky;
  top: 0;
  z-index: 100;

  background: rgba(0,0,0,.97);
  border-bottom: 2px solid var(--yellow);
}

.topbar-inner {
  max-width: 1900px;
  margin: auto;

  padding: 10px 16px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;
}

.brand-title {
  font-size: 20px;
  font-weight: 900;
  color: var(--yellow);
}

.brand-subtitle {
  color: #888;
  font-size: 11px;
  margin-top: 1px;
}

.actions {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}

.btn {
  border: 1px solid #333;
  border-radius: 7px;

  background: #151515;
  color: #eee;

  padding: 7px 10px;

  font-size: 11px;
  font-weight: 800;
}

.btn:hover {
  border-color: var(--yellow);
}

.btn-primary {
  background: var(--yellow);
  color: #000;
  border-color: var(--yellow);

  font-weight: 900;
}

.btn-primary:hover {
  background: #ffe843;
}

.btn:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.unsaved {
  display: none;

  color: var(--yellow);
  font-size: 10px;
  font-weight: 900;

  border: 1px solid #665b00;
  background: #211e00;

  padding: 6px 8px;
  border-radius: 999px;
}

.unsaved.show {
  display: inline-block;
}


/* PAGE */

.page {
  max-width: 1900px;
  margin: auto;

  padding: 12px 14px 30px;
}

.toolbar {
  display: flex;
  align-items: center;

  gap: 8px;

  margin-bottom: 10px;
}

.search {
  flex: 1;

  border: 1px solid #333;
  border-radius: 7px;

  background: #0b0b0b;
  color: white;

  padding: 8px 10px;

  font-size: 11px;
}

.search:focus {
  outline: none;
  border-color: var(--yellow);
}

.status {
  color: #888;
  font-size: 10px;
  white-space: nowrap;
}


/* DIVISIONS */

.stack {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.division {
  background: var(--panel);

  border: 1px solid #222;
  border-radius: 8px;

  overflow: hidden;
}

.division-header {
  height: 32px;

  padding: 0 10px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  border-left: 7px solid var(--division-colour);
}

.division-name {
  display: flex;
  align-items: center;
  gap: 8px;

  font-size: 12px;
  font-weight: 900;
}

.count {
  background: rgba(0,0,0,.28);
  border: 1px solid rgba(255,255,255,.15);

  border-radius: 999px;

  padding: 2px 6px;

  font-size: 9px;
}

.count.over {
  color: #ff8585;
}

.division[data-division="DIVISION 1"] {
  --division-colour: var(--d1);
}

.division[data-division="DIVISION 2A"] {
  --division-colour: var(--d2a);
}

.division[data-division="DIVISION 2B"] {
  --division-colour: var(--d2b);
}

.division[data-division="DIVISION 3A"] {
  --division-colour: var(--d3a);
}

.division[data-division="DIVISION 3B"] {
  --division-colour: var(--d3b);
}

.division[data-division="WAITLIST"] {
  --division-colour: var(--waitlist);
}

.division[data-division="INFILL"] {
  --division-colour: var(--infill);
}


/* TABLE */

.table-wrap {
  width: 100%;
}

table {
  width: 100%;

  border-collapse: collapse;

  table-layout: fixed;
}

th {
  background: #050505;

  color: #8c8c8c;

  border-top: 1px solid #202020;
  border-bottom: 1px solid #202020;

  padding: 5px 4px;

  font-size: 8px;
  font-weight: 900;

  text-align: left;
  text-transform: uppercase;

  line-height: 1.1;
}

td {
  padding: 4px;

  border-bottom: 1px solid #191919;

  font-size: 10px;

  vertical-align: middle;
}

tbody tr:last-child td {
  border-bottom: none;
}

tbody tr:hover {
  background: #101010;
}

tbody tr.dragging {
  opacity: .3;
}

tbody.drag-over {
  background: rgba(255,221,0,.04);
}


/* COLUMN WIDTHS */

.col-drag {
  width: 2%;
}

.col-id {
  width: 4%;
}

.col-team {
  width: 13%;
}

.col-manager {
  width: 9%;
}

.col-prevdiv {
  width: 7%;
}

.col-prevpos {
  width: 6%;
}

.col-overall {
  width: 5%;
}

.col-conference {
  width: 9%;
}

.col-intention {
  width: 8%;
}

.col-comments {
  width: 16%;
}

.col-contact {
  width: 12%;
}

.col-move {
  width: 9%;
}


/* CELLS */

.drag-handle {
  cursor: grab;

  color: #777;

  font-size: 13px;
  font-weight: 900;

  text-align: center;
}

.team {
  font-weight: 900;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.readonly {
  color: #c4c4c4;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}


/* INPUTS */

.field {
  width: 100%;

  background: #080808;
  color: #eee;

  border: 1px solid #292929;
  border-radius: 4px;

  padding: 4px;

  font-size: 9px;
}

.field:focus {
  outline: none;
  border-color: var(--yellow);
}

textarea.field {
  resize: none;
  height: 25px;

  overflow: hidden;
}

.confirmed {
  color: #9be4a2;
}

.likely {
  color: #ffe36b;
}

.unlikely {
  color: #ff8c8c;
}


/* ADD TEAM MODAL */

.modal-backdrop {
  position: fixed;
  inset: 0;

  z-index: 500;

  display: none;
  align-items: center;
  justify-content: center;

  padding: 15px;

  background: rgba(0,0,0,.8);
}

.modal-backdrop.show {
  display: flex;
}

.modal {
  width: min(520px, 100%);

  background: #0d0d0d;

  border: 1px solid #333;
  border-top: 4px solid var(--yellow);

  border-radius: 10px;

  padding: 18px;
}

.modal h2 {
  margin: 0 0 15px;

  color: var(--yellow);

  font-size: 18px;
}

.form-row {
  margin-bottom: 10px;
}

.form-row label {
  display: block;

  color: #999;

  margin-bottom: 4px;

  font-size: 9px;
  font-weight: 900;

  text-transform: uppercase;
}

.form-control {
  width: 100%;

  background: #050505;
  color: #fff;

  border: 1px solid #333;
  border-radius: 6px;

  padding: 8px;

  font-size: 11px;
}

.form-control:focus {
  outline: none;
  border-color: var(--yellow);
}

.modal-actions {
  display: flex;
  justify-content: flex-end;

  gap: 7px;

  margin-top: 16px;
}


/* MESSAGES */

.error {
  display: none;

  background: #260000;
  color: #ffaaaa;

  border: 1px solid #600;

  padding: 10px;

  border-radius: 6px;

  font-size: 11px;

  margin-bottom: 10px;
}

.error.show {
  display: block;
}

.loading {
  padding: 50px;
  text-align: center;
  color: #888;
}

.toast {
  position: fixed;

  right: 15px;
  bottom: 15px;

  z-index: 800;

  background: #111;
  color: var(--yellow);

  border: 1px solid #555;
  border-left: 4px solid var(--yellow);

  border-radius: 6px;

  padding: 9px 12px;

  font-size: 10px;
  font-weight: 900;

  opacity: 0;
  transform: translateY(10px);

  transition: .18s;

  pointer-events: none;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}


/* SMALL SCREEN */

@media (max-width: 1100px) {

  .table-wrap {
    overflow-x: auto;
  }

  table {
    min-width: 1300px;
  }

}

@media (max-width: 700px) {

  .topbar-inner {
    flex-direction: column;
    align-items: stretch;
  }

  .actions {
    justify-content: flex-start;
  }

  .page {
    padding: 8px;
  }

}
</style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">

    <div>
      <div class="brand-title">
        ELIZA CUP ADMIN
      </div>

      <div class="brand-subtitle">
        2026/27 Team Management
      </div>
    </div>

    <div class="actions">

      <span
        id="unsaved"
        class="unsaved"
      >
        UNSAVED CHANGES
      </span>

      <button
        id="addTeamBtn"
        class="btn btn-primary"
      >
        + Add Team
      </button>

      <button
        id="undoBtn"
        class="btn"
        disabled
      >
        Undo
      </button>

      <button
        id="discardBtn"
        class="btn"
        disabled
      >
        Discard
      </button>

      <button
        id="refreshBtn"
        class="btn"
      >
        Refresh
      </button>

      <button
        id="saveBtn"
        class="btn btn-primary"
        disabled
      >
        Save
      </button>

    </div>

  </div>
</header>


<main class="page">

  <div
    id="error"
    class="error"
  ></div>

  <div class="toolbar">

    <input
      id="search"
      class="search"
      placeholder="Search team, manager, ID, comments..."
    >

    <div
      id="status"
      class="status"
    >
      Loading...
    </div>

  </div>

  <div id="content">
    <div class="loading">
      Loading Eliza Cup teams...
    </div>
  </div>

</main>


<div
  id="addModal"
  class="modal-backdrop"
>

  <div class="modal">

    <h2>Add Team</h2>

    <div class="form-row">
      <label>Team Name</label>

      <input
        id="newTeam"
        class="form-control"
      >
    </div>

    <div class="form-row">
      <label>Manager</label>

      <input
        id="newManager"
        class="form-control"
      >
    </div>

    <div class="form-row">
      <label>Destination</label>

      <select
        id="newDivision"
        class="form-control"
      ></select>
    </div>

    <div class="form-row">
      <label>Intention to Play</label>

      <select
        id="newIntention"
        class="form-control"
      >
        <option value=""></option>
        <option>CONFIRMED</option>
        <option>LIKELY</option>
        <option>UNLIKELY</option>
      </select>
    </div>

    <div class="form-row">
      <label>Comments</label>

      <textarea
        id="newComments"
        class="form-control"
      ></textarea>
    </div>

    <div class="form-row">
      <label>Contact Method / Primary Chat</label>

      <input
        id="newContact"
        class="form-control"
      >
    </div>

    <div class="modal-actions">

      <button
        id="cancelAdd"
        class="btn"
      >
        Cancel
      </button>

      <button
        id="confirmAdd"
        class="btn btn-primary"
      >
        Add Team
      </button>

    </div>

  </div>
</div>


<div
  id="toast"
  class="toast"
></div>


<script>

const API_URL =
'https://script.google.com/macros/s/AKfycbweLNRiMQMu1nMlvKMTsJmur_NrMU688qqWaxzxR2qMMWUVS6FXcuaZvDpfZJoeXdrB/exec';


const DIVISIONS = [

  {
    key: 'DIVISION 1',
    label: 'Division 1',
    capacity: 14
  },

  {
    key: 'DIVISION 2A',
    label: 'Division 2A',
    capacity: 12
  },

  {
    key: 'DIVISION 2B',
    label: 'Division 2B',
    capacity: 12
  },

  {
    key: 'DIVISION 3A',
    label: 'Division 3A',
    capacity: 12
  },

  {
    key: 'DIVISION 3B',
    label: 'Division 3B',
    capacity: 12
  },

  {
    key: 'WAITLIST',
    label: 'Waitlist',
    capacity: null
  },

  {
    key: 'INFILL',
    label: 'Infill',
    capacity: null
  }

];


const INTENTIONS = [
  '',
  'CONFIRMED',
  'LIKELY',
  'UNLIKELY'
];


let teams = [];
let originalTeams = [];
let undoStack = [];

let draggedId = null;
let saving = false;


const content =
document.getElementById('content');

const search =
document.getElementById('search');

const status =
document.getElementById('status');

const error =
document.getElementById('error');

const unsaved =
document.getElementById('unsaved');

const saveBtn =
document.getElementById('saveBtn');

const undoBtn =
document.getElementById('undoBtn');

const discardBtn =
document.getElementById('discardBtn');

const refreshBtn =
document.getElementById('refreshBtn');

const addTeamBtn =
document.getElementById('addTeamBtn');

const addModal =
document.getElementById('addModal');

const cancelAdd =
document.getElementById('cancelAdd');

const confirmAdd =
document.getElementById('confirmAdd');

const toast =
document.getElementById('toast');


/***********************************************************
 * LOAD
 ***********************************************************/

async function loadTeams() {

  setError('');

  status.textContent =
    'Loading...';

  try {

    const response =
      await fetch(
        API_URL +
        '?action=getTeams&_=' +
        Date.now()
      );

    const data =
      await response.json();

    if (!data.success) {
      throw new Error(
        data.error ||
        'Unable to load teams.'
      );
    }

    teams =
      normaliseTeams(data.teams);

    originalTeams =
      clone(teams);

    undoStack = [];

    render();
    updateControls();

    status.textContent =
      `${teams.length} teams`;

  } catch (err) {

    console.error(err);

    setError(
      'Unable to load portal data: ' +
      err.message
    );

  }

}


/***********************************************************
 * NORMALISE
 ***********************************************************/

function normaliseTeams(list) {

  return (list || [])
    .map(t => ({

      id:
        String(t.id || '').trim(),

      team:
        String(t.team || '').trim(),

      manager:
        String(t.manager || '').trim(),

      division:
        String(t.division || '').trim(),

      order:
        Number(t.order) || 999,

      conference:
        String(t.conference || '').trim(),

      intention:
        String(t.intention || '').trim(),

      previousDivision:
        String(
          t.previousDivision || ''
        ).trim(),

      previousPosition:
        String(
          t.previousPosition || ''
        ).trim(),

      overall:
        String(t.overall || '').trim(),

      comments:
        String(t.comments || '').trim(),

      contact:
        String(t.contact || '').trim()

    }))
    .sort(sortTeams);

}


/***********************************************************
 * RENDER
 ***********************************************************/

function render() {

  const query =
    search.value
      .trim()
      .toLowerCase();

  const wrapper =
    document.createElement('div');

  wrapper.className =
    'stack';


  DIVISIONS.forEach(div => {

    const fullList =
      getDivisionTeams(div.key);

    const displayList =
      fullList.filter(team => {

        if (!query) {
          return true;
        }

        return [

          team.id,
          team.team,
          team.manager,

          team.previousDivision,
          team.previousPosition,
          team.overall,

          team.conference,
          team.intention,
          team.comments,
          team.contact

        ]
          .join(' ')
          .toLowerCase()
          .includes(query);

      });


    const section =
      document.createElement(
        'section'
      );

    section.className =
      'division';

    section.dataset.division =
      div.key;


    const countText =
      div.capacity === null

        ? fullList.length

        : `${fullList.length} / ${div.capacity}`;


    const over =
      div.capacity !== null &&
      fullList.length >
      div.capacity;


    section.innerHTML = `

      <div class="division-header">

        <div class="division-name">

          ${escapeHtml(div.label)}

          <span class="
            count
            ${over ? 'over' : ''}
          ">
            ${countText}
          </span>

        </div>

      </div>


      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th class="col-drag"></th>

              <th class="col-id">
                ID
              </th>

              <th class="col-team">
                Team
              </th>

              <th class="col-manager">
                Manager
              </th>

              <th class="col-prevdiv">
                Prev Div
              </th>

              <th class="col-prevpos">
                Prev Pos
              </th>

              <th class="col-overall">
                Overall
              </th>

              <th class="col-conference">
                26/27 Conf
              </th>

              <th class="col-intention">
                Intention
              </th>

              <th class="col-comments">
                Comments
              </th>

              <th class="col-contact">
                Contact
              </th>

              <th class="col-move">
                Move
              </th>

            </tr>

          </thead>


          <tbody
            data-division="${escapeHtml(div.key)}"
          >

            ${buildRows(displayList)}

          </tbody>

        </table>

      </div>

    `;

    wrapper.appendChild(section);

  });


  content.innerHTML = '';

  content.appendChild(wrapper);

  attachEditing();
  attachMoving();
  attachDrag();

}


/***********************************************************
 * ROWS
 ***********************************************************/

function buildRows(list) {

  if (!list.length) {

    return `

      <tr>

        <td
          colspan="12"
          style="
            text-align:center;
            padding:12px;
            color:#666
          "
        >
          No teams
        </td>

      </tr>

    `;

  }


  return list
    .map(team => `

      <tr
        draggable="true"
        data-team-id="${escapeHtml(team.id)}"
      >

        <td class="col-drag">

          <div class="drag-handle">
            ⋮⋮
          </div>

        </td>


        <td class="readonly">
          ${escapeHtml(team.id)}
        </td>


        <td>

          <div
            class="team"
            title="${escapeHtml(team.team)}"
          >
            ${
              escapeHtml(
                team.team ||
                team.manager ||
                'Unnamed'
              )
            }
          </div>

        </td>


        <td
          class="readonly"
          title="${escapeHtml(team.manager)}"
        >
          ${escapeHtml(team.manager || '—')}
        </td>


        <td class="readonly">
          ${
            escapeHtml(
              team.previousDivision ||
              '—'
            )
          }
        </td>


        <td class="readonly">
          ${
            escapeHtml(
              team.previousPosition ||
              '—'
            )
          }
        </td>


        <td class="readonly">
          ${escapeHtml(team.overall || '—')}
        </td>


        <td>

          <select
            class="field conference"
            data-id="${escapeHtml(team.id)}"
          >

            ${
              buildDivisionOptions(
                team.conference,
                true
              )
            }

          </select>

        </td>


        <td>

          <select
            class="
              field
              intention
              ${intentionClass(team.intention)}
            "
            data-id="${escapeHtml(team.id)}"
          >

            ${
              INTENTIONS
                .map(value => `

                  <option
                    value="${escapeHtml(value)}"
                    ${
                      value ===
                      team.intention
                        ? 'selected'
                        : ''
                    }
                  >
                    ${
                      escapeHtml(
                        value || '—'
                      )
                    }
                  </option>

                `)
                .join('')
            }

          </select>

        </td>


        <td>

          <textarea
            class="field comments"
            data-id="${escapeHtml(team.id)}"
          >${escapeHtml(team.comments)}</textarea>

        </td>


        <td>

          <input
            class="field contact"
            data-id="${escapeHtml(team.id)}"
            value="${escapeHtml(team.contact)}"
          >

        </td>


        <td>

          <select
            class="field move"
            data-id="${escapeHtml(team.id)}"
          >

            ${
              buildDivisionOptions(
                team.division,
                false
              )
            }

          </select>

        </td>

      </tr>

    `)
    .join('');

}


/***********************************************************
 * OPTIONS
 ***********************************************************/

function buildDivisionOptions(
  current,
  allowBlank
) {

  let html = '';

  if (allowBlank) {

    html += `

      <option value="">
        —
      </option>

    `;

  }


  DIVISIONS.forEach(div => {

    html += `

      <option
        value="${escapeHtml(div.key)}"
        ${
          current === div.key
            ? 'selected'
            : ''
        }
      >
        ${escapeHtml(div.label)}
      </option>

    `;

  });


  return html;

}


/***********************************************************
 * EDIT FIELDS
 ***********************************************************/

function attachEditing() {

  document
    .querySelectorAll(
      '.conference'
    )
    .forEach(input => {

      input.addEventListener(
        'change',
        () => {

          editField(
            input.dataset.id,
            'conference',
            input.value
          );

        }
      );

    });


  document
    .querySelectorAll(
      '.intention'
    )
    .forEach(input => {

      input.addEventListener(
        'change',
        () => {

          editField(
            input.dataset.id,
            'intention',
            input.value
          );

          render();

        }
      );

    });


  document
    .querySelectorAll(
      '.comments'
    )
    .forEach(input => {

      input.addEventListener(
        'input',
        () => {

          editField(
            input.dataset.id,
            'comments',
            input.value,
            false
          );

        }
      );

    });


  document
    .querySelectorAll(
      '.contact'
    )
    .forEach(input => {

      input.addEventListener(
        'input',
        () => {

          editField(
            input.dataset.id,
            'contact',
            input.value,
            false
          );

        }
      );

    });

}


function editField(
  id,
  field,
  value,
  snapshot = true
) {

  const team =
    teams.find(t =>
      t.id === id
    );

  if (!team) return;

  if (
    team[field] ===
    value
  ) {
    return;
  }

  if (snapshot) {
    undoStack.push(
      clone(teams)
    );
  }

  team[field] =
    value;

  updateControls();

}


/***********************************************************
 * MOVE
 ***********************************************************/

function attachMoving() {

  document
    .querySelectorAll('.move')
    .forEach(select => {

      select.addEventListener(
        'change',
        () => {

          moveTeam(
            select.dataset.id,
            select.value
          );

        }
      );

    });

}


function moveTeam(
  id,
  division,
  beforeId = null
) {

  const team =
    teams.find(t =>
      t.id === id
    );

  if (!team) return;


  if (
    team.division === division &&
    !beforeId
  ) {
    return;
  }


  undoStack.push(
    clone(teams)
  );


  const oldDivision =
    team.division;


  team.division =
    division;


  let divisionTeams =
    teams
      .filter(t =>
        t.division === division &&
        t.id !== id
      )
      .sort(sortTeams);


  let position =
    divisionTeams.length;


  if (beforeId) {

    const found =
      divisionTeams.findIndex(
        t => t.id === beforeId
      );

    if (found !== -1) {
      position = found;
    }

  }


  divisionTeams.splice(
    position,
    0,
    team
  );


  divisionTeams.forEach(
    (t, index) => {
      t.order =
        index + 1;
    }
  );


  reindexDivision(
    oldDivision
  );


  render();
  updateControls();

}


/***********************************************************
 * DRAG
 ***********************************************************/

function attachDrag() {

  document
    .querySelectorAll(
      'tr[data-team-id]'
    )
    .forEach(row => {

      row.addEventListener(
        'dragstart',
        event => {

          draggedId =
            row.dataset.teamId;

          row.classList.add(
            'dragging'
          );

          event.dataTransfer
            .setData(
              'text/plain',
              draggedId
            );

        }
      );


      row.addEventListener(
        'dragend',
        () => {

          row.classList.remove(
            'dragging'
          );

          draggedId = null;

        }
      );

    });


  document
    .querySelectorAll(
      'tbody[data-division]'
    )
    .forEach(body => {

      body.addEventListener(
        'dragover',
        event => {

          event.preventDefault();

          body.classList.add(
            'drag-over'
          );

        }
      );


      body.addEventListener(
        'dragleave',
        () => {

          body.classList.remove(
            'drag-over'
          );

        }
      );


      body.addEventListener(
        'drop',
        event => {

          event.preventDefault();

          body.classList.remove(
            'drag-over'
          );

          const id =
            draggedId ||
            event.dataTransfer
              .getData(
                'text/plain'
              );

          const target =
            event.target.closest(
              'tr[data-team-id]'
            );

          moveTeam(
            id,
            body.dataset.division,
            target
              ? target.dataset.teamId
              : null
          );

        }
      );

    });

}


/***********************************************************
 * ADD TEAM
 ***********************************************************/

function openAddModal() {

  document.getElementById(
    'newTeam'
  ).value = '';

  document.getElementById(
    'newManager'
  ).value = '';

  document.getElementById(
    'newIntention'
  ).value = '';

  document.getElementById(
    'newComments'
  ).value = '';

  document.getElementById(
    'newContact'
  ).value = '';


  const divisionSelect =
    document.getElementById(
      'newDivision'
    );

  divisionSelect.innerHTML =
    DIVISIONS
      .map(div => `

        <option
          value="${escapeHtml(div.key)}"
          ${
            div.key ===
            'WAITLIST'
              ? 'selected'
              : ''
          }
        >
          ${escapeHtml(div.label)}
        </option>

      `)
      .join('');


  addModal.classList.add(
    'show'
  );


  document.getElementById(
    'newTeam'
  ).focus();

}


function closeAddModal() {

  addModal.classList.remove(
    'show'
  );

}


async function addTeam() {

  const teamName =
    document.getElementById(
      'newTeam'
    ).value.trim();

  if (!teamName) {

    alert(
      'Enter a team name.'
    );

    return;

  }


  const payload = {

    action: 'addTeam',

    team: {

      team: teamName,

      manager:
        document.getElementById(
          'newManager'
        ).value.trim(),

      division:
        document.getElementById(
          'newDivision'
        ).value,

      intention:
        document.getElementById(
          'newIntention'
        ).value,

      comments:
        document.getElementById(
          'newComments'
        ).value.trim(),

      contact:
        document.getElementById(
          'newContact'
        ).value.trim()

    }

  };


  confirmAdd.disabled = true;

  confirmAdd.textContent =
    'Adding...';


  try {

    await fetch(
      API_URL,
      {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type':
            'text/plain;charset=utf-8'
        },
        body:
          JSON.stringify(payload)
      }
    );


    await sleep(900);

    closeAddModal();

    await loadTeams();

    showToast(
      'Team added'
    );

  } catch (err) {

    alert(
      'Could not add team.'
    );

  } finally {

    confirmAdd.disabled =
      false;

    confirmAdd.textContent =
      'Add Team';

  }

}


/***********************************************************
 * SAVE
 ***********************************************************/

async function saveChanges() {

  if (
    !hasChanges() ||
    saving
  ) {
    return;
  }


  saving = true;

  updateControls();

  status.textContent =
    'Saving...';


  try {

    const payload = {

      action: 'saveTeams',

      teams:
        teams.map(team => ({

          id:
            team.id,

          division:
            team.division,

          order:
            team.order,

          conference:
            team.conference,

          intention:
            team.intention,

          comments:
            team.comments,

          contact:
            team.contact

        }))

    };


    await fetch(
      API_URL,
      {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type':
            'text/plain;charset=utf-8'
        },
        body:
          JSON.stringify(payload)
      }
    );


    await sleep(900);


    const response =
      await fetch(
        API_URL +
        '?action=getTeams&_=' +
        Date.now()
      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.error ||
        'Save verification failed.'
      );

    }


    const server =
      normaliseTeams(
        data.teams
      );


    if (
      !sameState(
        teams,
        server
      )
    ) {

      throw new Error(
        'Saved data could not be verified.'
      );

    }


    teams = server;

    originalTeams =
      clone(server);

    undoStack = [];

    render();
    updateControls();

    status.textContent =
      `${teams.length} teams`;

    showToast(
      'Changes saved'
    );


  } catch (err) {

    setError(
      'Save failed: ' +
      err.message
    );


  } finally {

    saving = false;

    updateControls();

  }

}


/***********************************************************
 * STATE
 ***********************************************************/

function sameState(a, b) {

  return JSON.stringify(
    comparable(a)
  ) ===
  JSON.stringify(
    comparable(b)
  );

}


function comparable(list) {

  return list
    .map(t => ({

      id:
        t.id,

      division:
        t.division,

      order:
        Number(t.order),

      conference:
        t.conference,

      intention:
        t.intention,

      comments:
        t.comments,

      contact:
        t.contact

    }))
    .sort(
      (a, b) =>
        a.id.localeCompare(b.id)
    );

}


function hasChanges() {

  return !sameState(
    teams,
    originalTeams
  );

}


function updateControls() {

  const changed =
    hasChanges();

  saveBtn.disabled =
    !changed ||
    saving;

  discardBtn.disabled =
    !changed ||
    saving;

  undoBtn.disabled =
    !undoStack.length ||
    saving;

  refreshBtn.disabled =
    saving;

  unsaved.classList.toggle(
    'show',
    changed
  );

}


/***********************************************************
 * UNDO / DISCARD
 ***********************************************************/

function undo() {

  if (!undoStack.length) {
    return;
  }

  teams =
    undoStack.pop();

  render();
  updateControls();

}


function discard() {

  if (!hasChanges()) {
    return;
  }

  if (
    !confirm(
      'Discard all unsaved changes?'
    )
  ) {
    return;
  }

  teams =
    clone(originalTeams);

  undoStack = [];

  render();
  updateControls();

}


/***********************************************************
 * HELPERS
 ***********************************************************/

function getDivisionTeams(
  division
) {

  return teams
    .filter(
      team =>
        team.division === division
    )
    .sort(sortTeams);

}


function reindexDivision(
  division
) {

  getDivisionTeams(
    division
  )
    .forEach(
      (team, index) => {
        team.order =
          index + 1;
      }
    );

}


function sortTeams(a, b) {

  const da =
    DIVISIONS.findIndex(
      d =>
        d.key ===
        a.division
    );

  const db =
    DIVISIONS.findIndex(
      d =>
        d.key ===
        b.division
    );

  if (da !== db) {
    return da - db;
  }

  return (
    Number(a.order || 999) -
    Number(b.order || 999)
  );

}


function intentionClass(
  value
) {

  const v =
    String(value)
      .toUpperCase();

  if (
    v === 'CONFIRMED'
  ) {
    return 'confirmed';
  }

  if (
    v === 'LIKELY'
  ) {
    return 'likely';
  }

  if (
    v === 'UNLIKELY'
  ) {
    return 'unlikely';
  }

  return '';

}


function clone(value) {

  return JSON.parse(
    JSON.stringify(value)
  );

}


function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


function escapeHtml(value) {

  return String(
    value ?? ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


function setError(message) {

  error.textContent =
    message;

  error.classList.toggle(
    'show',
    !!message
  );

}


let toastTimer;

function showToast(message) {

  clearTimeout(
    toastTimer
  );

  toast.textContent =
    message;

  toast.classList.add(
    'show'
  );

  toastTimer =
    setTimeout(
      () => {
        toast.classList.remove(
          'show'
        );
      },
      2200
    );

}


/***********************************************************
 * EVENTS
 ***********************************************************/

search.addEventListener(
  'input',
  render
);


saveBtn.addEventListener(
  'click',
  saveChanges
);


undoBtn.addEventListener(
  'click',
  undo
);


discardBtn.addEventListener(
  'click',
  discard
);


refreshBtn.addEventListener(
  'click',
  () => {

    if (
      hasChanges() &&
      !confirm(
        'Discard unsaved changes and refresh?'
      )
    ) {
      return;
    }

    loadTeams();

  }
);


addTeamBtn.addEventListener(
  'click',
  openAddModal
);


cancelAdd.addEventListener(
  'click',
  closeAddModal
);


confirmAdd.addEventListener(
  'click',
  addTeam
);


addModal.addEventListener(
  'click',
  event => {

    if (
      event.target ===
      addModal
    ) {

      closeAddModal();

    }

  }
);


window.addEventListener(
  'beforeunload',
  event => {

    if (!hasChanges()) {
      return;
    }

    event.preventDefault();

    event.returnValue = '';

  }
);


/***********************************************************
 * START
 ***********************************************************/

loadTeams();

</script>
