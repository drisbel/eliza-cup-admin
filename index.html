<script>

/************************************************************
 * APPS SCRIPT WEB APP
 ************************************************************/

const API_URL =
  'https://script.google.com/macros/s/AKfycbweLNRiMQMu1nMlvKMTsJmur_NrMU688qqWaxzxR2qMMWUVS6FXcuaZvDpfZJoeXdrB/exec';


/************************************************************
 * DIVISIONS
 *
 * This is the ONLY division definition used by:
 *
 * - render
 * - move dropdown
 * - drag/drop
 * - add team
 *
 * Therefore they cannot drift apart.
 *
 * DISPLAY:
 * Not Playing
 *
 * DATABASE:
 * NOT RETURNING
 ************************************************************/

const DIVISIONS = [

  {

    key:
      'DIVISION 1',

    label:
      'Division 1',

    capacity:
      14

  },


  {

    key:
      'DIVISION 2A',

    label:
      'Division 2A',

    capacity:
      12

  },


  {

    key:
      'DIVISION 2B',

    label:
      'Division 2B',

    capacity:
      12

  },


  {

    key:
      'DIVISION 3A',

    label:
      'Division 3A',

    capacity:
      12

  },


  {

    key:
      'DIVISION 3B',

    label:
      'Division 3B',

    capacity:
      12

  },


  {

    key:
      'WAITLIST',

    label:
      'Waitlist',

    capacity:
      null

  },


  {

    key:
      'INFILL',

    label:
      'Infill',

    capacity:
      null

  },


  {

    key:
      'NOT RETURNING',

    label:
      'Not Playing',

    capacity:
      null

  }

];


const INTENTIONS = [

  '',

  'CONFIRMED',

  'LIKELY',

  'UNLIKELY'

];


/************************************************************
 * STATE
 ************************************************************/

let teams =
  [];


let originalTeams =
  [];


let undoStack =
  [];


let draggedId =
  null;


let saving =
  false;


/************************************************************
 * ELEMENTS
 ************************************************************/

const content =
  document.getElementById(
    'content'
  );


const search =
  document.getElementById(
    'search'
  );


const status =
  document.getElementById(
    'status'
  );


const error =
  document.getElementById(
    'error'
  );


const unsaved =
  document.getElementById(
    'unsaved'
  );


const saveBtn =
  document.getElementById(
    'saveBtn'
  );


const undoBtn =
  document.getElementById(
    'undoBtn'
  );


const discardBtn =
  document.getElementById(
    'discardBtn'
  );


const refreshBtn =
  document.getElementById(
    'refreshBtn'
  );


const addTeamBtn =
  document.getElementById(
    'addTeamBtn'
  );


const addModal =
  document.getElementById(
    'addModal'
  );


const cancelAdd =
  document.getElementById(
    'cancelAdd'
  );


const confirmAdd =
  document.getElementById(
    'confirmAdd'
  );


const toast =
  document.getElementById(
    'toast'
  );


/************************************************************
 * NORMALISE ELIZA ID
 ************************************************************/

function normaliseId(
  value
) {

  const text =
    String(
      value || ''
    ).trim();


  if (!text) {
    return '';
  }


  if (
    /^\d+$/.test(
      text
    )
  ) {

    return String(
      parseInt(
        text,
        10
      )
    ).padStart(
      3,
      '0'
    );

  }


  return text;

}


/************************************************************
 * NORMALISE DIVISION
 ************************************************************/

function normaliseDivision(
  value
) {

  const text =
    String(
      value || ''
    )
      .trim()
      .toUpperCase()
      .replace(
        /\s+/g,
        ' '
      );


  const map = {


    'DIV 1':
      'DIVISION 1',


    'D1':
      'DIVISION 1',


    'DIVISION 1':
      'DIVISION 1',


    'DIV 2A':
      'DIVISION 2A',


    '2A':
      'DIVISION 2A',


    'DIVISION 2A':
      'DIVISION 2A',


    'DIV 2B':
      'DIVISION 2B',


    '2B':
      'DIVISION 2B',


    'DIVISION 2B':
      'DIVISION 2B',


    'DIV 3A':
      'DIVISION 3A',


    '3A':
      'DIVISION 3A',


    'DIVISION 3A':
      'DIVISION 3A',


    'DIV 3B':
      'DIVISION 3B',


    '3B':
      'DIVISION 3B',


    'DIVISION 3B':
      'DIVISION 3B',


    'WAITLIST':
      'WAITLIST',


    'WAIT LIST':
      'WAITLIST',


    'INFILL':
      'INFILL',


    'POTENTIAL INFILL OPTION':
      'INFILL',


    /*
     * NOT PLAYING aliases.
     */

    'NOT RETURNING':
      'NOT RETURNING',


    'NOT PLAYING':
      'NOT RETURNING',


    'NOT RETURNING / WITHDRAWN':
      'NOT RETURNING',


    'NOT RETURNING/WITHDRAWN':
      'NOT RETURNING',


    'WITHDRAWN':
      'NOT RETURNING'

  };


  return (
    map[text] ||
    text
  );

}


/************************************************************
 * LOAD
 ************************************************************/

async function loadTeams() {

  setError(
    ''
  );


  status.textContent =
    'Loading...';


  try {


    const response =
      await fetch(

        API_URL +
        '?action=getTeams&_=' +
        Date.now()

      );


    if (
      !response.ok
    ) {

      throw new Error(
        'HTTP ' +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      !data.success
    ) {

      throw new Error(
        data.error ||
        'Unable to load teams.'
      );

    }


    teams =
      normaliseTeams(
        data.teams
      );


    /*
     * Duplicate-ID protection.
     */

    validateTeamState(
      teams
    );


    originalTeams =
      clone(
        teams
      );


    undoStack =
      [];


    render();


    updateControls();


    status.textContent =
      teams.length +
      ' teams';


  } catch (err) {


    console.error(
      err
    );


    setError(
      'Unable to load portal data: ' +
      err.message
    );


    status.textContent =
      'Load failed';

  }

}


/************************************************************
 * NORMALISE TEAM OBJECTS
 ************************************************************/

function normaliseTeams(
  list
) {

  return (
    list || []
  )
    .map(
      team => ({

        id:
          normaliseId(
            team.id
          ),


        team:
          String(
            team.team || ''
          ).trim(),


        manager:
          String(
            team.manager || ''
          ).trim(),


        division:
          normaliseDivision(
            team.division
          ),


        order:
          Number(
            team.order
          ) || 999,


        intention:
          String(
            team.intention || ''
          )
            .trim()
            .toUpperCase(),


        previousDivision:
          String(
            team.previousDivision ||
            ''
          ).trim(),


        previousPosition:
          String(
            team.previousPosition ||
            ''
          ).trim(),


        overall:
          String(
            team.overall ||
            ''
          ).trim(),


        comments:
          String(
            team.comments ||
            ''
          ).trim(),


        contact:
          String(
            team.contact ||
            ''
          ).trim()

      })
    )
    .sort(
      sortTeams
    );

}


/************************************************************
 * VALIDATE BROWSER STATE
 ************************************************************/

function validateTeamState(
  list
) {

  const seen =
    new Set();


  list.forEach(
    team => {


      if (!team.id) {

        throw new Error(
          'A team has no ELIZA ID.'
        );

      }


      if (
        seen.has(
          team.id
        )
      ) {

        throw new Error(
          'Duplicate ELIZA ID: ' +
          team.id
        );

      }


      seen.add(
        team.id
      );


      if (
        !DIVISIONS.some(
          division =>
            division.key ===
            normaliseDivision(
              team.division
            )
        )
      ) {

        throw new Error(
          'Unknown division for ' +
          team.id +
          ': ' +
          team.division
        );

      }

    }
  );

}


/************************************************************
 * RENDER
 ************************************************************/

function render() {

  const query =
    search.value
      .trim()
      .toLowerCase();


  const wrapper =
    document.createElement(
      'div'
    );


  wrapper.className =
    'stack';


  DIVISIONS.forEach(
    division => {


      const fullList =
        getDivisionTeams(
          division.key
        );


      const visible =
        fullList.filter(
          team => {


            if (!query) {
              return true;
            }


            return [

              team.id,

              team.team,

              team.manager,

              team.previousDivision,

              team.previousPosition,

              team.overall,

              team.intention,

              team.comments,

              team.contact

            ]
              .join(
                ' '
              )
              .toLowerCase()
              .includes(
                query
              );

          }
        );


      const section =
        document.createElement(
          'section'
        );


      section.className =
        'division';


      section.dataset.division =
        division.key;


      const countText =
        division.capacity ===
        null

          ? String(
              fullList.length
            )

          : (
              fullList.length +
              ' / ' +
              division.capacity
            );


      const over =
        division.capacity !==
        null &&
        fullList.length >
        division.capacity;


      section.innerHTML = `

        <div class="division-header">

          <div class="division-name">

            ${escapeHtml(
              division.label
            )}

            <span
              class="
                count
                ${
                  over
                    ? 'over'
                    : ''
                }
              "
            >
              ${countText}
            </span>

          </div>

        </div>


        <div class="table-wrap">

          <table>

            <thead>

              <tr>

                <th class="col-drag">
                </th>

                <th class="col-id">
                  ID
                </th>

                <th class="col-team">
                  Team
                </th>

                <th class="col-manager">
                  Manager
                </th>

                <th class="col-prevdiv">
                  Prev Div
                </th>

                <th class="col-prevpos">
                  Prev Pos
                </th>

                <th class="col-overall">
                  Overall
                </th>

                <th class="col-intention">
                  Intention
                </th>

                <th class="col-comments">
                  Comments
                </th>

                <th class="col-contact">
                  Contact
                </th>

                <th class="col-move">
                  Move
                </th>

            </thead>


            <tbody

                division.key

  attachMoving();

function editField(
  id,
  field,
  value
) {

  id =
    normaliseId(
      id
    );


  const team =
    teams.find(
      item =>
        item.id ===
        id
    );


  if (!team) {
    return;
  }


  if (
    team[field] ===
    value
  ) {
    return;
  }


  pushUndo();


  team[field] =
    value;


  updateControls();

}

/************************************************************
 * MOVE
 *
 * Team is NEVER removed from teams[].
 * Only division/order are changed.
 ************************************************************/

function moveTeam(
  id,
  newDivision,
  beforeId = null
) {

  id =
    normaliseId(
      id
    );


  newDivision =
    normaliseDivision(
      newDivision
    );


  if (
    !DIVISIONS.some(
      division =>
        division.key ===
        newDivision
    )
  ) {

    setError(
      'Invalid destination: ' +
      newDivision
    );

    return;

  }


  const team =
    teams.find(
      item =>
        item.id ===
        id
    );


  if (!team) {

    setError(
      'Could not find team ' +
      id
    );

    return;

  }


  const oldDivision =
    team.division;


  if (
    oldDivision ===
    newDivision &&
    !beforeId
  ) {

    return;

  }


  pushUndo();


  /*
   * Change ONLY the destination.
   */

  team.division =
    newDivision;


  /*
   * Rebuild target division order.
   */

  const destinationTeams =
    teams
      .filter(
        item =>
          item.id !==
          id &&
          normaliseDivision(
            item.division
          ) ===
          newDivision
      )
      .sort(
        (a,b) =>
          Number(
            a.order || 999
          ) -
          Number(
            b.order || 999
          )
      );


  let insertIndex =
    destinationTeams.length;


  if (
    beforeId
  ) {

    const targetId =
      normaliseId(
        beforeId
      );


    const targetIndex =
      destinationTeams
        .findIndex(
          item =>
            item.id ===
            targetId
        );


    if (
      targetIndex !==
      -1
    ) {

      insertIndex =
        targetIndex;

    }

  }


  destinationTeams.splice(

    insertIndex,

    0,

    team

  );


  destinationTeams.forEach(
    (item,index) => {

      item.order =
        index + 1;

    }
  );


  reindexDivision(
    oldDivision
  );


  validateTeamState(
    teams
  );


  render();


  updateControls();

}


/************************************************************
 * DRAG DROP
 ************************************************************/

function attachDrag() {


  document
    .querySelectorAll(
      'tr[data-team-id]'
    )
    .forEach(
      row => {


        row.addEventListener(
          'dragstart',
          event => {


            draggedId =
              normaliseId(
                row.dataset.teamId
              );


            row.classList.add(
              'dragging'
            );


            event
              .dataTransfer
              .setData(
                'text/plain',
                draggedId
              );


            event.dataTransfer.effectAllowed =
              'move';

          }
        );


        row.addEventListener(
          'dragend',
          () => {


            draggedId =
              null;


            row.classList.remove(
              'dragging'
            );


            document
              .querySelectorAll(
                'tbody.drag-over'
              )
              .forEach(
                body =>
                  body.classList.remove(
                    'drag-over'
                  )
              );

          }
        );

      }
    );


  document
    .querySelectorAll(
      'tbody[data-division]'
    )
    .forEach(
      body => {


        body.addEventListener(
          'dragover',
          event => {


            event.preventDefault();


            event.dataTransfer.dropEffect =
              'move';


            body.classList.add(
              'drag-over'
            );

          }
        );


        body.addEventListener(
          'dragleave',
          event => {


            if (
              body.contains(
                event.relatedTarget
              )
            ) {
              return;
            }


            body.classList.remove(
              'drag-over'
            );

          }
        );


        body.addEventListener(
          'drop',
          event => {


            event.preventDefault();


            body.classList.remove(
              'drag-over'
            );


            const id =
              normaliseId(

                draggedId ||

                event
                  .dataTransfer
                  .getData(
                    'text/plain'
                  )

              );


            if (!id) {
              return;
            }


            const target =
              event.target.closest(
                'tr[data-team-id]'
              );


            moveTeam(

              id,

              body.dataset.division,

              target
                ? target.dataset.teamId
                : null

            );

          }
        );

      }
    );

}

/************************************************************
 * SAVE
 ************************************************************/

async function saveChanges() {

  if (
    !hasChanges() ||
    saving
  ) {

    return;

  }


  setError(
    ''
  );


  /*
   * Validate before sending anything.
   */

  try {

    validateTeamState(
      teams
    );

  } catch (err) {

    setError(
      err.message
    );

    return;

  }


  saving =
    true;


  updateControls();


  status.textContent =
    'Saving...';


  try {


    const payload = {

      action:
        'saveTeams',


      /*
       * Sending full list is fine,
       * but backend STILL merges safely.
       */

      teams:
        teams.map(
          team => ({


            id:
              normaliseId(
                team.id
              ),


            division:
              normaliseDivision(
                team.division
              ),


            order:
              Number(
                team.order
              ) || 999,


            intention:
              team.intention,


            comments:
              team.comments,


            contact:
              team.contact

          })
        )

    };


    await fetch(
      API_URL,
      {

        method:
          'POST',

        mode:
          'no-cors',

        headers: {

          'Content-Type':
            'text/plain;charset=utf-8'

        },

        body:
          JSON.stringify(
            payload
          )

      }
    );


    /*
     * Apps Script no-cors response cannot
     * be inspected, so re-read database.
     */

    await sleep(
      1200
    );


    const response =
      await fetch(

        API_URL +
        '?action=getTeams&_=' +
        Date.now()

      );


    const data =
      await response.json();


    if (
      !data.success
    ) {

      throw new Error(
        data.error ||
        'Save verification failed.'
      );

    }


    const fresh =
      normaliseTeams(
        data.teams
      );


    validateTeamState(
      fresh
    );


    /*
     * Critical client-side integrity check.
     *
     * A save must never reduce total team count.
     */

    if (
      fresh.length <
      originalTeams.length
    ) {

      throw new Error(

        'Safety check failed: database returned fewer teams after saving.'

      );

    }


    teams =
      fresh;


    originalTeams =
      clone(
        fresh
      );


    undoStack =
      [];


    render();


    updateControls();


    status.textContent =
      teams.length +
      ' teams';


    showToast(
      'Changes saved safely'
    );


  } catch (err) {


    console.error(
      err
    );


    setError(
      'Save failed: ' +
      err.message
    );


    status.textContent =
      'Save failed';


  } finally {


    saving =
      false;


    updateControls();

  }

}


/************************************************************
 * UNSAVED STATE
 ************************************************************/

function comparable(
  list
) {

  return list
    .map(
      team => ({


        id:
          normaliseId(
            team.id
          ),


        division:
          normaliseDivision(
            team.division
          ),


        order:
          Number(
            team.order
          ),


        intention:
          team.intention,


        comments:
          team.comments,


        contact:
          team.contact

      })
    )
    .sort(
      (a,b) =>
        a.id.localeCompare(
          b.id
        )
    );

}


function hasChanges() {

  return (
    JSON.stringify(
      comparable(
        teams
      )
    ) !==
    JSON.stringify(
      comparable(
        originalTeams
      )
    )
  );

}


function updateControls() {

  const changed =
    hasChanges();


  saveBtn.disabled =
    !changed ||
    saving;


  discardBtn.disabled =
    !changed ||
    saving;


  undoBtn.disabled =
    !undoStack.length ||
    saving;


  refreshBtn.disabled =
    saving;


  addTeamBtn.disabled =
    saving;


  unsaved.classList.toggle(
    'show',
    changed
  );

}


/************************************************************
 * UNDO
 ************************************************************/

function pushUndo() {

  undoStack.push(
    clone(
      teams
    )
  );


  /*
   * Don't keep unlimited history.
   */

  if (
    undoStack.length >
    50
  ) {

    undoStack.shift();

  }

}


function undo() {

  if (
    !undoStack.length
  ) {
    return;
  }


  teams =
    undoStack.pop();


  validateTeamState(
    teams
  );


  render();


  updateControls();

}


/************************************************************
 * DISCARD
 ************************************************************/

function discard() {

  if (
    !hasChanges()
  ) {

    return;

  }


  if (
    !confirm(
      'Discard all unsaved changes?'
    )
  ) {

    return;

  }


  teams =
    clone(
      originalTeams
    );


  undoStack =
    [];


  render();


  updateControls();

}


/************************************************************
 * DIVISION HELPERS
 ************************************************************/

function getDivisionTeams(
  division
) {

  division =
    normaliseDivision(
      division
    );


  return teams
    .filter(
      team =>
        normaliseDivision(
          team.division
        ) ===
        division
    )
    .sort(
      (a,b) =>
        Number(
          a.order || 999
        ) -
        Number(
          b.order || 999
        )
    );

}


function reindexDivision(
  division
) {

  division =
    normaliseDivision(
      division
    );


  getDivisionTeams(
    division
  )
    .forEach(
      (team,index) => {

        team.order =
          index + 1;

      }
    );

}


/************************************************************
 * SORT
 ************************************************************/

function sortTeams(
  a,
  b
) {

  const aDivision =
    normaliseDivision(
      a.division
    );


  const bDivision =
    normaliseDivision(
      b.division
    );


  let da =
    DIVISIONS.findIndex(
      division =>
        division.key ===
        aDivision
    );


  let db =
    DIVISIONS.findIndex(
      division =>
        division.key ===
        bDivision
    );


  if (
    da === -1
  ) {
    da = 999;
  }


  if (
    db === -1
  ) {
    db = 999;
  }


  if (
    da !== db
  ) {

    return (
      da -
      db
    );

  }


  return (
    Number(
      a.order || 999
    ) -
    Number(
      b.order || 999
    )
  );

}


/************************************************************
 * INTENTION COLOUR
 ************************************************************/

function intentionClass(
  value
) {

  const text =
    String(
      value || ''
    ).toUpperCase();


  if (
    text ===
    'CONFIRMED'
  ) {

    return 'confirmed';

  }


  if (
    text ===
    'LIKELY'
  ) {

    return 'likely';

  }


  if (
    text ===
    'UNLIKELY'
  ) {

    return 'unlikely';

  }


  return '';

}


/************************************************************
 * HELPERS
 ************************************************************/

function clone(
  value
) {

  return JSON.parse(
    JSON.stringify(
      value
    )
  );

}


function sleep(
  ms
) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


function escapeHtml(
  value
) {

  return String(
    value ?? ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


function setError(
  message
) {

  error.textContent =
    message;


  error.classList.toggle(
    'show',
    !!message
  );

}


let toastTimer;


function showToast(
  message
) {

  clearTimeout(
    toastTimer
  );


  toast.textContent =
    message;


  toast.classList.add(
    'show'
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          'show'
        );

      },
      2200
    );

}


/************************************************************
 * EVENTS
 ************************************************************/

search.addEventListener(
  'input',
  render
);


saveBtn.addEventListener(
  'click',
  saveChanges
);


undoBtn.addEventListener(
  'click',
  undo
);


discardBtn.addEventListener(
  'click',
  discard
);


refreshBtn.addEventListener(
  'click',
  () => {


    if (
      hasChanges() &&
      !confirm(
        'Discard unsaved changes and refresh?'
      )
    ) {

      return;

    }


    loadTeams();

  }
);


addTeamBtn.addEventListener(
  'click',
  openAddModal
);


cancelAdd.addEventListener(
  'click',
  closeAddModal
);


confirmAdd.addEventListener(
  'click',
  addTeam
);


addModal.addEventListener(
  'click',
  event => {


    if (
      event.target ===
      addModal
    ) {

      closeAddModal();

    }

  }
);


window.addEventListener(
  'beforeunload',
  event => {


    if (
      !hasChanges()
    ) {

      return;

    }


    event.preventDefault();


    event.returnValue =
      '';

  }
);


/************************************************************
 * START
 ************************************************************/

loadTeams();

</script>
