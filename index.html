<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Eliza Cup Admin</title>

<style>

:root {

  --black: #000000;
  --panel: #0a0a0a;
  --panel2: #111111;

  --line: #242424;

  --text: #eeeeee;
  --muted: #888888;

  --yellow: #ffdd00;

  --d1: #28427c;
  --d2a: #bc3532;
  --d2b: #990000;
  --d3a: #6aa84f;
  --d3b: #274e13;

  --waitlist: #555555;
  --infill: #806f00;

  --notplaying: #4a1111;

}


* {
  box-sizing: border-box;
}


html,
body {

  margin: 0;

  background:
    var(--black);

  color:
    var(--text);

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

}


button,
input,
select,
textarea {
  font: inherit;
}


button {
  cursor: pointer;
}


/************************************************************
 * HEADER
 ************************************************************/

.topbar {

  position: sticky;

  top: 0;

  z-index: 100;

  background:
    rgba(0,0,0,.97);

  border-bottom:
    2px solid
    var(--yellow);

}


.topbar-inner {

  max-width:
    1900px;

  margin:
    auto;

  padding:
    8px 12px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    12px;

}


.brand-title {

  color:
    var(--yellow);

  font-size:
    21px;

  font-weight:
    950;

  letter-spacing:
    -.4px;

}


.brand-subtitle {

  margin-top:
    1px;

  color:
    #777;

  font-size:
    10px;

}


.actions {

  display:
    flex;

  gap:
    5px;

  align-items:
    center;

  flex-wrap:
    wrap;

}


.btn {

  padding:
    6px 9px;

  border:
    1px solid #333;

  border-radius:
    6px;

  background:
    #111;

  color:
    #eee;

  font-size:
    10px;

  font-weight:
    800;

}


.btn:hover {

  border-color:
    var(--yellow);

}


.btn-primary {

  background:
    var(--yellow);

  border-color:
    var(--yellow);

  color:
    #000;

  font-weight:
    950;

}


.btn:disabled {

  opacity:
    .4;

  cursor:
    not-allowed;

}


.unsaved {

  display:
    none;

  padding:
    5px 7px;

  border:
    1px solid #6c5f00;

  border-radius:
    999px;

  color:
    var(--yellow);

  background:
    #211d00;

  font-size:
    9px;

  font-weight:
    900;

}


.unsaved.show {
  display: inline-block;
}


/************************************************************
 * PAGE
 ************************************************************/

.page {

  max-width:
    1900px;

  margin:
    auto;

  padding:
    9px 10px 30px;

}


.toolbar {

  display:
    flex;

  align-items:
    center;

  gap:
    8px;

  margin-bottom:
    8px;

}


.search {

  flex:
    1;

  min-width:
    160px;

  padding:
    7px 9px;

  border:
    1px solid #333;

  border-radius:
    6px;

  background:
    #080808;

  color:
    white;

  font-size:
    10px;

}


.search:focus {

  outline:
    none;

  border-color:
    var(--yellow);

}


.status {

  color:
    #777;

  font-size:
    9px;

  white-space:
    nowrap;

}


/************************************************************
 * DIVISION STACK
 ************************************************************/

.stack {

  display:
    flex;

  flex-direction:
    column;

  gap:
    7px;

}


.division {

  overflow:
    hidden;

  border:
    1px solid #202020;

  border-radius:
    7px;

  background:
    var(--panel);

}


/************************************************************
 * FULL COLOUR DIVISION HEADERS
 ************************************************************/

.division-header {

  min-height:
    34px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  padding:
    5px 10px;

  background:
    var(--division-colour);

  color:
    white;

}


.division-name {

  display:
    flex;

  align-items:
    center;

  gap:
    8px;

  font-size:
    13px;

  font-weight:
    950;

  text-shadow:
    0 1px 2px
    rgba(0,0,0,.55);

}


.count {

  padding:
    2px 7px;

  border:
    1px solid
    rgba(255,255,255,.4);

  border-radius:
    999px;

  background:
    rgba(0,0,0,.22);

  font-size:
    9px;

  font-weight:
    900;

}


.count.over {

  background:
    #000;

  color:
    #ff7777;

}


/************************************************************
 * DIVISION COLOURS
 ************************************************************/

.division[data-division="DIVISION 1"] {
  --division-colour: var(--d1);
}

.division[data-division="DIVISION 2A"] {
  --division-colour: var(--d2a);
}

.division[data-division="DIVISION 2B"] {
  --division-colour: var(--d2b);
}

.division[data-division="DIVISION 3A"] {
  --division-colour: var(--d3a);
}

.division[data-division="DIVISION 3B"] {
  --division-colour: var(--d3b);
}

.division[data-division="WAITLIST"] {
  --division-colour: var(--waitlist);
}

.division[data-division="INFILL"] {
  --division-colour: var(--infill);
}

.division[data-division="NOT RETURNING"] {
  --division-colour: var(--notplaying);
}


/************************************************************
 * TABLE
 ************************************************************/

.table-wrap {
  width: 100%;
}


table {

  width:
    100%;

  border-collapse:
    collapse;

  table-layout:
    fixed;

}


th {

  padding:
    4px 3px;

  border-bottom:
    1px solid #252525;

  background:
    #050505;

  color:
    #888;

  text-align:
    left;

  text-transform:
    uppercase;

  font-size:
    7.5px;

  font-weight:
    900;

  line-height:
    1;

}


td {

  height:
    31px;

  padding:
    3px;

  border-bottom:
    1px solid #171717;

  vertical-align:
    middle;

  font-size:
    9px;

}


tbody tr:last-child td {
  border-bottom: none;
}


tbody tr:hover {
  background: #101010;
}


tbody tr.dragging {
  opacity: .3;
}


tbody.drag-over {
  background: rgba(255,221,0,.05);
}


/************************************************************
 * COLUMN WIDTHS
 ************************************************************/

.col-drag {
  width: 1.5%;
}

.col-id {
  width: 3.5%;
}

.col-team {
  width: 21%;
}

.col-manager {
  width: 8%;
}

.col-prevdiv {
  width: 6%;
}

.col-prevpos {
  width: 6%;
}

.col-overall {
  width: 4.5%;
}

.col-intention {
  width: 7%;
}

.col-comments {
  width: 18%;
}

.col-contact {
  width: 12%;
}

.col-move {
  width: 11.5%;
}


/************************************************************
 * CELLS
 ************************************************************/

.drag-handle {

  cursor:
    grab;

  color:
    #666;

  font-size:
    12px;

  text-align:
    center;

}


.team-name {

  overflow:
    hidden;

  color:
    #ffffff;

  font-size:
    13px;

  font-weight:
    950;

  line-height:
    1;

  white-space:
    nowrap;

  text-overflow:
    ellipsis;

}


.readonly {

  overflow:
    hidden;

  color:
    #bfbfbf;

  white-space:
    nowrap;

  text-overflow:
    ellipsis;

}


/************************************************************
 * INPUTS
 ************************************************************/

.field {

  width:
    100%;

  height:
    24px;

  padding:
    2px 4px;

  border:
    1px solid #282828;

  border-radius:
    4px;

  background:
    #080808;

  color:
    #ddd;

  font-size:
    8.5px;

}


.field:focus {

  outline:
    none;

  border-color:
    var(--yellow);

}


textarea.field {

  resize:
    none;

  overflow:
    hidden;

  line-height:
    17px;

}


.confirmed {
  color: #98e69e;
}

.likely {
  color: #ffe873;
}

.unlikely {
  color: #ff9393;
}


/************************************************************
 * MODAL
 ************************************************************/

.modal-backdrop {

  position:
    fixed;

  inset:
    0;

  z-index:
    500;

  display:
    none;

  align-items:
    center;

  justify-content:
    center;

  padding:
    15px;

  background:
    rgba(0,0,0,.82);

}


.modal-backdrop.show {
  display: flex;
}


.modal {

  width:
    min(500px,100%);

  padding:
    17px;

  border:
    1px solid #333;

  border-top:
    4px solid
    var(--yellow);

  border-radius:
    9px;

  background:
    #0d0d0d;

}


.modal h2 {

  margin:
    0 0 14px;

  color:
    var(--yellow);

  font-size:
    17px;

}


.form-row {
  margin-bottom: 9px;
}


.form-row label {

  display:
    block;

  margin-bottom:
    3px;

  color:
    #888;

  font-size:
    8px;

  font-weight:
    900;

  text-transform:
    uppercase;

}


.form-control {

  width:
    100%;

  padding:
    7px;

  border:
    1px solid #333;

  border-radius:
    5px;

  background:
    #050505;

  color:
    white;

  font-size:
    10px;

}


.form-control:focus {

  outline:
    none;

  border-color:
    var(--yellow);

}


.modal-actions {

  display:
    flex;

  justify-content:
    flex-end;

  gap:
    6px;

  margin-top:
    13px;

}


/************************************************************
 * ERROR / TOAST
 ************************************************************/

.error {

  display:
    none;

  margin-bottom:
    8px;

  padding:
    9px;

  border:
    1px solid #650000;

  border-radius:
    6px;

  background:
    #260000;

  color:
    #ffaaaa;

  font-size:
    10px;

}


.error.show {
  display: block;
}


.loading {

  padding:
    45px;

  color:
    #777;

  text-align:
    center;

}


.toast {

  position:
    fixed;

  right:
    14px;

  bottom:
    14px;

  z-index:
    800;

  padding:
    8px 11px;

  border:
    1px solid #444;

  border-left:
    4px solid
    var(--yellow);

  border-radius:
    6px;

  background:
    #111;

  color:
    var(--yellow);

  font-size:
    9px;

  font-weight:
    900;

  opacity:
    0;

  transform:
    translateY(10px);

  transition:
    .18s;

  pointer-events:
    none;

}


.toast.show {

  opacity:
    1;

  transform:
    translateY(0);

}


/************************************************************
 * RESPONSIVE
 ************************************************************/

@media (max-width: 1050px) {

  .table-wrap {
    overflow-x: auto;
  }

  table {
    min-width: 1150px;
  }

}


@media (max-width: 700px) {

  .topbar-inner {

    flex-direction:
      column;

    align-items:
      stretch;

  }

  .page {
    padding: 7px;
  }

}

</style>

</head>


<body>


<header class="topbar">

  <div class="topbar-inner">

    <div>

      <div class="brand-title">
        ELIZA CUP ADMIN
      </div>

      <div class="brand-subtitle">
        2026/27 Team Management
      </div>

    </div>


    <div class="actions">

      <span
        id="unsaved"
        class="unsaved"
      >
        UNSAVED
      </span>


      <button
        id="addTeamBtn"
        class="btn btn-primary"
      >
        + Add Team
      </button>


      <button
        id="undoBtn"
        class="btn"
        disabled
      >
        Undo
      </button>


      <button
        id="discardBtn"
        class="btn"
        disabled
      >
        Discard
      </button>


      <button
        id="refreshBtn"
        class="btn"
      >
        Refresh
      </button>


      <button
        id="saveBtn"
        class="btn btn-primary"
        disabled
      >
        Save
      </button>

    </div>

  </div>

</header>


<main class="page">


  <div
    id="error"
    class="error"
  ></div>


  <div class="toolbar">

    <input
      id="search"
      class="search"
      placeholder="Search team, manager, ID, position, comments..."
    >


    <div
      id="status"
      class="status"
    >
      Loading...
    </div>

  </div>


  <div id="content">

    <div class="loading">
      Loading Eliza Cup teams...
    </div>

  </div>


</main>


<div
  id="addModal"
  class="modal-backdrop"
>

  <div class="modal">

    <h2>Add Team</h2>


    <div class="form-row">

      <label>
        Team Name
      </label>

      <input
        id="newTeam"
        class="form-control"
      >

    </div>


    <div class="form-row">

      <label>
        Manager
      </label>

      <input
        id="newManager"
        class="form-control"
      >

    </div>


    <div class="form-row">

      <label>
        Destination
      </label>

      <select
        id="newDivision"
        class="form-control"
      ></select>

    </div>


    <div class="form-row">

      <label>
        Intention
      </label>

      <select
        id="newIntention"
        class="form-control"
      >

        <option value=""></option>
        <option>CONFIRMED</option>
        <option>LIKELY</option>
        <option>UNLIKELY</option>

      </select>

    </div>


    <div class="form-row">

      <label>
        Comments
      </label>

      <textarea
        id="newComments"
        class="form-control"
      ></textarea>

    </div>


    <div class="form-row">

      <label>
        Contact
      </label>

      <input
        id="newContact"
        class="form-control"
      >

    </div>


    <div class="modal-actions">

      <button
        id="cancelAdd"
        class="btn"
      >
        Cancel
      </button>


      <button
        id="confirmAdd"
        class="btn btn-primary"
      >
        Add Team
      </button>

    </div>

  </div>

</div>


<div
  id="toast"
  class="toast"
></div>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbweLNRiMQMu1nMlvKMTsJmur_NrMU688qqWaxzxR2qMMWUVS6FXcuaZvDpfZJoeXdrB/exec';


/************************************************************
 * DIVISIONS
 *
 * IMPORTANT:
 *
 * "Not Playing" is only the DISPLAY LABEL.
 *
 * Its stored/internal value is:
 * NOT RETURNING
 ************************************************************/

const DIVISIONS = [

  {
    key: 'DIVISION 1',
    label: 'Division 1',
    capacity: 14
  },

  {
    key: 'DIVISION 2A',
    label: 'Division 2A',
    capacity: 12
  },

  {
    key: 'DIVISION 2B',
    label: 'Division 2B',
    capacity: 12
  },

  {
    key: 'DIVISION 3A',
    label: 'Division 3A',
    capacity: 12
  },

  {
    key: 'DIVISION 3B',
    label: 'Division 3B',
    capacity: 12
  },

  {
    key: 'WAITLIST',
    label: 'Waitlist',
    capacity: null
  },

  {
    key: 'INFILL',
    label: 'Infill',
    capacity: null
  },

  {
    key: 'NOT RETURNING',
    label: 'Not Playing',
    capacity: null
  }

];


const INTENTIONS = [
  '',
  'CONFIRMED',
  'LIKELY',
  'UNLIKELY'
];


let teams = [];
let originalTeams = [];
let undoStack = [];

let draggedId = null;
let saving = false;


const content =
  document.getElementById(
    'content'
  );

const search =
  document.getElementById(
    'search'
  );

const status =
  document.getElementById(
    'status'
  );

const error =
  document.getElementById(
    'error'
  );

const unsaved =
  document.getElementById(
    'unsaved'
  );

const saveBtn =
  document.getElementById(
    'saveBtn'
  );

const undoBtn =
  document.getElementById(
    'undoBtn'
  );

const discardBtn =
  document.getElementById(
    'discardBtn'
  );

const refreshBtn =
  document.getElementById(
    'refreshBtn'
  );

const addTeamBtn =
  document.getElementById(
    'addTeamBtn'
  );

const addModal =
  document.getElementById(
    'addModal'
  );

const cancelAdd =
  document.getElementById(
    'cancelAdd'
  );

const confirmAdd =
  document.getElementById(
    'confirmAdd'
  );

const toast =
  document.getElementById(
    'toast'
  );


/************************************************************
 * NORMALISE DIVISION CLIENT SIDE
 ************************************************************/

function normaliseDivision(
  value
) {

  const text =
    String(
      value || ''
    )
      .trim()
      .toUpperCase()
      .replace(
        /\s+/g,
        ' '
      );


  const map = {

    'DIV 1':
      'DIVISION 1',

    'DIVISION 1':
      'DIVISION 1',

    'DIV 2A':
      'DIVISION 2A',

    'DIVISION 2A':
      'DIVISION 2A',

    'DIV 2B':
      'DIVISION 2B',

    'DIVISION 2B':
      'DIVISION 2B',

    'DIV 3A':
      'DIVISION 3A',

    'DIVISION 3A':
      'DIVISION 3A',

    'DIV 3B':
      'DIVISION 3B',

    'DIVISION 3B':
      'DIVISION 3B',

    'WAITLIST':
      'WAITLIST',

    'INFILL':
      'INFILL',

    'POTENTIAL INFILL OPTION':
      'INFILL',

    'NOT RETURNING':
      'NOT RETURNING',

    'NOT PLAYING':
      'NOT RETURNING',

    'NOT RETURNING / WITHDRAWN':
      'NOT RETURNING',

    'WITHDRAWN':
      'NOT RETURNING'

  };


  return (
    map[text] ||
    text
  );

}


/************************************************************
 * LOAD
 ************************************************************/

async function loadTeams() {

  setError('');

  status.textContent =
    'Loading...';


  try {

    const response =
      await fetch(
        API_URL +
        '?action=getTeams&_=' +
        Date.now()
      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.error ||
        'Unable to load teams.'
      );

    }


    teams =
      normaliseTeams(
        data.teams
      );


    originalTeams =
      clone(
        teams
      );


    undoStack = [];


    render();

    updateControls();


    status.textContent =
      `${teams.length} teams`;


  } catch (err) {

    console.error(
      err
    );


    setError(
      'Unable to load portal data: ' +
      err.message
    );

  }

}


/************************************************************
 * NORMALISE TEAMS
 ************************************************************/

function normaliseTeams(list) {

  return (list || [])
    .map(team => ({

      id:
        String(
          team.id || ''
        ).trim(),

      team:
        String(
          team.team || ''
        ).trim(),

      manager:
        String(
          team.manager || ''
        ).trim(),

      division:
        normaliseDivision(
          team.division
        ),

      order:
        Number(
          team.order
        ) || 999,

      intention:
        String(
          team.intention || ''
        ).trim(),

      previousDivision:
        String(
          team.previousDivision || ''
        ).trim(),

      previousPosition:
        String(
          team.previousPosition || ''
        ).trim(),

      overall:
        String(
          team.overall || ''
        ).trim(),

      comments:
        String(
          team.comments || ''
        ).trim(),

      contact:
        String(
          team.contact || ''
        ).trim()

    }))
    .sort(
      sortTeams
    );

}


/************************************************************
 * RENDER
 ************************************************************/

function render() {

  const query =
    search.value
      .trim()
      .toLowerCase();


  const wrapper =
    document.createElement(
      'div'
    );

  wrapper.className =
    'stack';


  DIVISIONS.forEach(div => {

    const fullList =
      getDivisionTeams(
        div.key
      );


    const visible =
      fullList.filter(team => {

        if (!query) {
          return true;
        }

        return [

          team.id,
          team.team,
          team.manager,
          team.previousDivision,
          team.previousPosition,
          team.overall,
          team.intention,
          team.comments,
          team.contact

        ]
          .join(' ')
          .toLowerCase()
          .includes(query);

      });


    const section =
      document.createElement(
        'section'
      );


    section.className =
      'division';


    section.dataset.division =
      div.key;


    const count =
      div.capacity === null

        ? fullList.length

        : `${fullList.length} / ${div.capacity}`;


    const over =
      div.capacity !== null &&
      fullList.length >
      div.capacity;


    section.innerHTML = `

      <div class="division-header">

        <div class="division-name">

          ${escapeHtml(div.label)}

          <span class="
            count
            ${over ? 'over' : ''}
          ">
            ${count}
          </span>

        </div>

      </div>


      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th class="col-drag"></th>

              <th class="col-id">
                ID
              </th>

              <th class="col-team">
                Team
              </th>

              <th class="col-manager">
                Manager
              </th>

              <th class="col-prevdiv">
                Prev Div
              </th>

              <th class="col-prevpos">
                Prev Pos
              </th>

              <th class="col-overall">
                Overall
              </th>

              <th class="col-intention">
                Intention
              </th>

              <th class="col-comments">
                Comments
              </th>

              <th class="col-contact">
                Contact
              </th>

              <th class="col-move">
                Move
              </th>

            </tr>

          </thead>


          <tbody
            data-division="${escapeHtml(div.key)}"
          >

            ${buildRows(visible)}

          </tbody>

        </table>

      </div>

    `;


    wrapper.appendChild(
      section
    );

  });


  content.innerHTML =
    '';


  content.appendChild(
    wrapper
  );


  attachEditing();
  attachMoving();
  attachDrag();

}


/************************************************************
 * ROWS
 ************************************************************/

function buildRows(list) {

  if (!list.length) {

    return `

      <tr>

        <td
          colspan="11"
          style="
            text-align:center;
            padding:9px;
            color:#666;
          "
        >
          No teams
        </td>

      </tr>

    `;

  }


  return list
    .map(team => `

      <tr
        draggable="true"
        data-team-id="${escapeHtml(team.id)}"
      >

        <td>
          <div class="drag-handle">
            ⋮⋮
          </div>
        </td>


        <td class="readonly">
          ${escapeHtml(team.id)}
        </td>


        <td>

          <div
            class="team-name"
            title="${escapeHtml(team.team)}"
          >
            ${
              escapeHtml(
                team.team ||
                team.manager ||
                'Unnamed'
              )
            }
          </div>

        </td>


        <td
          class="readonly"
          title="${escapeHtml(team.manager)}"
        >
          ${escapeHtml(team.manager || '—')}
        </td>


        <td class="readonly">
          ${escapeHtml(team.previousDivision || '—')}
        </td>


        <td class="readonly">
          ${escapeHtml(team.previousPosition || '—')}
        </td>


        <td class="readonly">
          ${escapeHtml(team.overall || '—')}
        </td>


        <td>

          <select
            class="
              field
              intention
              ${intentionClass(team.intention)}
            "
            data-id="${escapeHtml(team.id)}"
          >

            ${
              INTENTIONS
                .map(value => `

                  <option
                    value="${escapeHtml(value)}"
                    ${
                      value === team.intention
                        ? 'selected'
                        : ''
                    }
                  >
                    ${escapeHtml(value || '—')}
                  </option>

                `)
                .join('')
            }

          </select>

        </td>


        <td>

          <textarea
            class="field comments"
            data-id="${escapeHtml(team.id)}"
          >${escapeHtml(team.comments)}</textarea>

        </td>


        <td>

          <input
            class="field contact"
            data-id="${escapeHtml(team.id)}"
            value="${escapeHtml(team.contact)}"
          >

        </td>


        <td>

          <select
            class="field move"
            data-id="${escapeHtml(team.id)}"
          >

            ${buildDivisionOptions(
              team.division
            )}

          </select>

        </td>

      </tr>

    `)
    .join('');

}


/************************************************************
 * DIVISION OPTIONS
 ************************************************************/

function buildDivisionOptions(
  current
) {

  current =
    normaliseDivision(
      current
    );


  return DIVISIONS
    .map(div => `

      <option
        value="${escapeHtml(div.key)}"
        ${
          current === div.key
            ? 'selected'
            : ''
        }
      >
        ${escapeHtml(div.label)}
      </option>

    `)
    .join('');

}


/************************************************************
 * EDITING
 ************************************************************/

function attachEditing() {

  document
    .querySelectorAll(
      '.intention'
    )
    .forEach(input => {

      input.addEventListener(
        'change',
        () => {

          editField(
            input.dataset.id,
            'intention',
            input.value
          );

          render();

        }
      );

    });


  document
    .querySelectorAll(
      '.comments'
    )
    .forEach(input => {

      input.addEventListener(
        'change',
        () => {

          editField(
            input.dataset.id,
            'comments',
            input.value
          );

        }
      );

    });


  document
    .querySelectorAll(
      '.contact'
    )
    .forEach(input => {

      input.addEventListener(
        'change',
        () => {

          editField(
            input.dataset.id,
            'contact',
            input.value
          );

        }
      );

    });

}


function editField(
  id,
  field,
  value
) {

  const team =
    teams.find(
      team =>
        team.id === id
    );


  if (!team) {
    return;
  }


  if (
    team[field] ===
    value
  ) {
    return;
  }


  undoStack.push(
    clone(teams)
  );


  team[field] =
    value;


  updateControls();

}


/************************************************************
 * MOVE
 ************************************************************/

function attachMoving() {

  document
    .querySelectorAll(
      '.move'
    )
    .forEach(select => {

      select.addEventListener(
        'change',
        () => {

          moveTeam(
            select.dataset.id,
            select.value
          );

        }
      );

    });

}


function moveTeam(
  id,
  division,
  beforeId = null
) {

  division =
    normaliseDivision(
      division
    );


  const team =
    teams.find(
      team =>
        team.id === id
    );


  if (!team) {
    return;
  }


  if (
    team.division === division &&
    !beforeId
  ) {
    return;
  }


  undoStack.push(
    clone(teams)
  );


  const oldDivision =
    team.division;


  team.division =
    division;


  let targetTeams =
    teams
      .filter(item =>
        item.division === division &&
        item.id !== id
      )
      .sort(sortTeams);


  let insertIndex =
    targetTeams.length;


  if (beforeId) {

    const found =
      targetTeams.findIndex(
        item =>
          item.id ===
          beforeId
      );


    if (
      found !== -1
    ) {

      insertIndex =
        found;

    }

  }


  targetTeams.splice(
    insertIndex,
    0,
    team
  );


  targetTeams.forEach(
    (item, index) => {

      item.order =
        index + 1;

    }
  );


  reindexDivision(
    oldDivision
  );


  render();

  updateControls();

}


/************************************************************
 * DRAG
 ************************************************************/

function attachDrag() {

  document
    .querySelectorAll(
      'tr[data-team-id]'
    )
    .forEach(row => {

      row.addEventListener(
        'dragstart',
        event => {

          draggedId =
            row.dataset.teamId;


          row.classList.add(
            'dragging'
          );


          event
            .dataTransfer
            .setData(
              'text/plain',
              draggedId
            );

        }
      );


      row.addEventListener(
        'dragend',
        () => {

          draggedId =
            null;


          row.classList.remove(
            'dragging'
          );

        }
      );

    });


  document
    .querySelectorAll(
      'tbody[data-division]'
    )
    .forEach(body => {

      body.addEventListener(
        'dragover',
        event => {

          event.preventDefault();

          body.classList.add(
            'drag-over'
          );

        }
      );


      body.addEventListener(
        'dragleave',
        () => {

          body.classList.remove(
            'drag-over'
          );

        }
      );


      body.addEventListener(
        'drop',
        event => {

          event.preventDefault();


          body.classList.remove(
            'drag-over'
          );


          const id =
            draggedId ||
            event
              .dataTransfer
              .getData(
                'text/plain'
              );


          const target =
            event.target.closest(
              'tr[data-team-id]'
            );


          moveTeam(
            id,
            body.dataset.division,
            target
              ? target.dataset.teamId
              : null
          );

        }
      );

    });

}


/************************************************************
 * ADD TEAM
 ************************************************************/

function openAddModal() {

  document.getElementById(
    'newTeam'
  ).value = '';


  document.getElementById(
    'newManager'
  ).value = '';


  document.getElementById(
    'newIntention'
  ).value = '';


  document.getElementById(
    'newComments'
  ).value = '';


  document.getElementById(
    'newContact'
  ).value = '';


  document.getElementById(
    'newDivision'
  ).innerHTML =
    DIVISIONS
      .map(div => `

        <option
          value="${escapeHtml(div.key)}"
          ${
            div.key === 'WAITLIST'
              ? 'selected'
              : ''
          }
        >
          ${escapeHtml(div.label)}
        </option>

      `)
      .join('');


  addModal.classList.add(
    'show'
  );


  document
    .getElementById(
      'newTeam'
    )
    .focus();

}


function closeAddModal() {

  addModal.classList.remove(
    'show'
  );

}


async function addTeam() {

  const teamName =
    document
      .getElementById(
        'newTeam'
      )
      .value
      .trim();


  const manager =
    document
      .getElementById(
        'newManager'
      )
      .value
      .trim();


  if (
    !teamName &&
    !manager
  ) {

    alert(
      'Enter either a team name or manager.'
    );

    return;

  }


  const payload = {

    action:
      'addTeam',

    team: {

      team:
        teamName,

      manager,

      division:
        document
          .getElementById(
            'newDivision'
          )
          .value,

      intention:
        document
          .getElementById(
            'newIntention'
          )
          .value,

      comments:
        document
          .getElementById(
            'newComments'
          )
          .value
          .trim(),

      contact:
        document
          .getElementById(
            'newContact'
          )
          .value
          .trim()

    }

  };


  confirmAdd.disabled =
    true;


  confirmAdd.textContent =
    'Adding...';


  try {

    await fetch(
      API_URL,
      {

        method:
          'POST',

        mode:
          'no-cors',

        headers: {
          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body:
          JSON.stringify(
            payload
          )

      }
    );


    await sleep(
      1000
    );


    closeAddModal();


    await loadTeams();


    showToast(
      'Team added'
    );


  } catch (err) {

    alert(
      'Could not add team.'
    );

  } finally {

    confirmAdd.disabled =
      false;


    confirmAdd.textContent =
      'Add Team';

  }

}


/************************************************************
 * SAVE
 ************************************************************/

async function saveChanges() {

  if (
    !hasChanges() ||
    saving
  ) {
    return;
  }


  saving =
    true;


  updateControls();


  status.textContent =
    'Saving...';


  try {

    const payload = {

      action:
        'saveTeams',

      teams:
        teams.map(team => ({

          id:
            team.id,

          division:
            normaliseDivision(
              team.division
            ),

          order:
            team.order,

          intention:
            team.intention,

          comments:
            team.comments,

          contact:
            team.contact

        }))

    };


    await fetch(
      API_URL,
      {

        method:
          'POST',

        mode:
          'no-cors',

        headers: {
          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body:
          JSON.stringify(
            payload
          )

      }
    );


    await sleep(
      1000
    );


    const response =
      await fetch(
        API_URL +
        '?action=getTeams&_=' +
        Date.now()
      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.error ||
        'Save failed'
      );

    }


    teams =
      normaliseTeams(
        data.teams
      );


    originalTeams =
      clone(
        teams
      );


    undoStack =
      [];


    render();

    updateControls();


    status.textContent =
      `${teams.length} teams`;


    showToast(
      'Changes saved'
    );


  } catch (err) {

    setError(
      'Save failed: ' +
      err.message
    );

  } finally {

    saving =
      false;


    updateControls();

  }

}


/************************************************************
 * STATE
 ************************************************************/

function comparable(list) {

  return list
    .map(team => ({

      id:
        team.id,

      division:
        normaliseDivision(
          team.division
        ),

      order:
        Number(
          team.order
        ),

      intention:
        team.intention,

      comments:
        team.comments,

      contact:
        team.contact

    }))
    .sort(
      (a,b) =>
        a.id.localeCompare(
          b.id
        )
    );

}


function hasChanges() {

  return (
    JSON.stringify(
      comparable(teams)
    ) !==
    JSON.stringify(
      comparable(originalTeams)
    )
  );

}


function updateControls() {

  const changed =
    hasChanges();


  saveBtn.disabled =
    !changed ||
    saving;


  discardBtn.disabled =
    !changed ||
    saving;


  undoBtn.disabled =
    !undoStack.length ||
    saving;


  refreshBtn.disabled =
    saving;


  unsaved.classList.toggle(
    'show',
    changed
  );

}


/************************************************************
 * UNDO / DISCARD
 ************************************************************/

function undo() {

  if (!undoStack.length) {
    return;
  }


  teams =
    undoStack.pop();


  render();

  updateControls();

}


function discard() {

  if (!hasChanges()) {
    return;
  }


  if (
    !confirm(
      'Discard all unsaved changes?'
    )
  ) {
    return;
  }


  teams =
    clone(
      originalTeams
    );


  undoStack =
    [];


  render();

  updateControls();

}


/************************************************************
 * HELPERS
 ************************************************************/

function getDivisionTeams(
  division
) {

  division =
    normaliseDivision(
      division
    );


  return teams
    .filter(team =>
      normaliseDivision(
        team.division
      ) === division
    )
    .sort(
      sortTeams
    );

}


function reindexDivision(
  division
) {

  division =
    normaliseDivision(
      division
    );


  getDivisionTeams(
    division
  )
    .forEach(
      (team,index) => {

        team.order =
          index + 1;

      }
    );

}


function sortTeams(
  a,
  b
) {

  const aDivision =
    normaliseDivision(
      a.division
    );


  const bDivision =
    normaliseDivision(
      b.division
    );


  let da =
    DIVISIONS.findIndex(
      division =>
        division.key ===
        aDivision
    );


  let db =
    DIVISIONS.findIndex(
      division =>
        division.key ===
        bDivision
    );


  if (
    da === -1
  ) {
    da = 999;
  }


  if (
    db === -1
  ) {
    db = 999;
  }


  if (
    da !== db
  ) {

    return (
      da -
      db
    );

  }


  return (
    Number(
      a.order || 999
    ) -
    Number(
      b.order || 999
    )
  );

}


function intentionClass(
  value
) {

  const text =
    String(
      value || ''
    ).toUpperCase();


  if (
    text === 'CONFIRMED'
  ) {
    return 'confirmed';
  }


  if (
    text === 'LIKELY'
  ) {
    return 'likely';
  }


  if (
    text === 'UNLIKELY'
  ) {
    return 'unlikely';
  }


  return '';

}


function clone(value) {

  return JSON.parse(
    JSON.stringify(
      value
    )
  );

}


function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


function escapeHtml(value) {

  return String(
    value ?? ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


function setError(
  message
) {

  error.textContent =
    message;


  error.classList.toggle(
    'show',
    !!message
  );

}


let toastTimer;


function showToast(
  message
) {

  clearTimeout(
    toastTimer
  );


  toast.textContent =
    message;


  toast.classList.add(
    'show'
  );


  toastTimer =
    setTimeout(
      () =>
        toast.classList.remove(
          'show'
        ),
      2200
    );

}


/************************************************************
 * EVENTS
 ************************************************************/

search.addEventListener(
  'input',
  render
);


saveBtn.addEventListener(
  'click',
  saveChanges
);


undoBtn.addEventListener(
  'click',
  undo
);


discardBtn.addEventListener(
  'click',
  discard
);


refreshBtn.addEventListener(
  'click',
  () => {

    if (
      hasChanges() &&
      !confirm(
        'Discard unsaved changes and refresh?'
      )
    ) {
      return;
    }


    loadTeams();

  }
);


addTeamBtn.addEventListener(
  'click',
  openAddModal
);


cancelAdd.addEventListener(
  'click',
  closeAddModal
);


confirmAdd.addEventListener(
  'click',
  addTeam
);


addModal.addEventListener(
  'click',
  event => {

    if (
      event.target ===
      addModal
    ) {

      closeAddModal();

    }

  }
);


window.addEventListener(
  'beforeunload',
  event => {

    if (!hasChanges()) {
      return;
    }


    event.preventDefault();

    event.returnValue =
      '';

  }
);


/************************************************************
 * START
 ************************************************************/

loadTeams();

</script>
