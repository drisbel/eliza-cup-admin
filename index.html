<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eliza Cup Admin</title>

  <style>
    :root {
      --bg: #0b1220;
      --panel: #121a2b;
      --panel-2: #182235;
      --line: rgba(255,255,255,.09);
      --text: #f5f7fb;
      --muted: #9eabc2;
      --accent: #4f7cff;
      --accent-2: #2f5fe8;
      --success: #1fa971;
      --warning: #d89b2b;
      --danger: #d9534f;
      --shadow: 0 12px 30px rgba(0,0,0,.22);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 18, 32, .96);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      max-width: 1500px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      justify-content: space-between;
    }

    .brand {
      min-width: 0;
    }

    .brand-title {
      font-weight: 800;
      font-size: 20px;
      letter-spacing: .2px;
    }

    .brand-subtitle {
      margin-top: 2px;
      font-size: 12px;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 9px;
      font-weight: 700;
      transition: .15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.18);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-2);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: .45;
      transform: none;
    }

    .unsaved-pill {
      display: none;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(216, 155, 43, .13);
      color: #ffd98b;
      border: 1px solid rgba(216, 155, 43, .3);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .unsaved-pill.show {
      display: inline-flex;
    }

    .page {
      max-width: 1500px;
      margin: 0 auto;
      padding: 20px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .search-wrap {
      flex: 1;
      min-width: 240px;
    }

    .search {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      padding: 11px 13px;
      outline: none;
    }

    .search:focus {
      border-color: rgba(79, 124, 255, .75);
      box-shadow: 0 0 0 3px rgba(79, 124, 255, .12);
    }

    .status-line {
      font-size: 12px;
      color: var(--muted);
      margin-left: auto;
    }

    .division-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .division-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .division-card.full-width {
      grid-column: 1 / -1;
    }

    .division-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 13px 15px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.025);
    }

    .division-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .division-title h2 {
      margin: 0;
      font-size: 14px;
      letter-spacing: .4px;
    }

    .count-pill {
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.045);
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
    }

    .count-pill.over {
      color: #ffb3b3;
      border-color: rgba(217,83,79,.4);
      background: rgba(217,83,79,.12);
    }

    .table-wrap {
      width: 100%;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead th {
      padding: 9px 10px;
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .7px;
      font-weight: 800;
      text-align: left;
      border-bottom: 1px solid var(--line);
    }

    tbody tr {
      border-bottom: 1px solid rgba(255,255,255,.055);
      transition: background .12s ease;
    }

    tbody tr:last-child {
      border-bottom: 0;
    }

    tbody tr:hover {
      background: rgba(255,255,255,.025);
    }

    tbody tr.dragging {
      opacity: .35;
    }

    tbody.drag-over {
      background: rgba(79,124,255,.06);
      outline: 2px dashed rgba(79,124,255,.4);
      outline-offset: -4px;
    }

    td {
      padding: 9px 10px;
      vertical-align: middle;
      font-size: 12px;
      overflow: hidden;
    }

    .drag-col {
      width: 34px;
      text-align: center;
      color: var(--muted);
    }

    .drag-handle {
      cursor: grab;
      user-select: none;
      font-size: 16px;
      line-height: 1;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .team-cell {
      min-width: 0;
    }

    .team-name {
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .team-meta {
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .manager-cell {
      width: 140px;
      color: #d3daea;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-cell {
      width: 108px;
    }

    .status-badge {
      display: inline-flex;
      max-width: 100%;
      padding: 4px 7px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.035);
      color: var(--muted);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-confirmed {
      color: #8de6bd;
      background: rgba(31,169,113,.11);
      border-color: rgba(31,169,113,.3);
    }

    .status-likely {
      color: #a9c2ff;
      background: rgba(79,124,255,.11);
      border-color: rgba(79,124,255,.28);
    }

    .status-unlikely {
      color: #ffbfbc;
      background: rgba(217,83,79,.1);
      border-color: rgba(217,83,79,.28);
    }

    .move-cell {
      width: 126px;
    }

    .move-select {
      width: 100%;
      background: #111a2a;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 6px 7px;
      font-size: 10px;
    }

    .empty-row {
      padding: 24px !important;
      color: var(--muted);
      text-align: center;
      font-size: 11px;
    }

    .loading {
      padding: 80px 20px;
      text-align: center;
      color: var(--muted);
    }

    .error-panel {
      display: none;
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 12px;
      border: 1px solid rgba(217,83,79,.35);
      background: rgba(217,83,79,.08);
      color: #ffc3c1;
      font-size: 13px;
      line-height: 1.5;
    }

    .error-panel.show {
      display: block;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 999;
      background: #1a2537;
      color: white;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 14px;
      box-shadow: var(--shadow);
      font-size: 12px;
      font-weight: 700;
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.success {
      border-color: rgba(31,169,113,.35);
    }

    .toast.error {
      border-color: rgba(217,83,79,.4);
    }

    .footer-note {
      margin-top: 18px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 980px) {
      .division-grid {
        grid-template-columns: 1fr;
      }

      .division-card.full-width {
        grid-column: auto;
      }

      .manager-cell {
        width: 120px;
      }
    }

    @media (max-width: 720px) {
      .topbar-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .header-actions {
        width: 100%;
        justify-content: flex-start;
      }

      .page {
        padding: 12px;
      }

      .toolbar {
        align-items: stretch;
      }

      .status-line {
        width: 100%;
        margin-left: 0;
      }

      .manager-cell,
      .status-cell {
        display: none;
      }

      .drag-col {
        width: 28px;
      }

      .move-cell {
        width: 110px;
      }

      .team-name {
        font-size: 12px;
      }

      td {
        padding: 9px 7px;
      }
    }
  </style>
</head>

<body>
  <div class="app-shell">

    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-title">Eliza Cup Admin</div>
          <div class="brand-subtitle">2026/27 Team & Division Management</div>
        </div>

        <div class="header-actions">
          <span id="unsavedPill" class="unsaved-pill">
            UNSAVED CHANGES
          </span>

          <button id="undoBtn" class="btn" disabled>
            Undo
          </button>

          <button id="discardBtn" class="btn" disabled>
            Discard
          </button>

          <button id="refreshBtn" class="btn">
            Refresh
          </button>

          <button id="saveBtn" class="btn btn-primary" disabled>
            Save Changes
          </button>
        </div>
      </div>
    </header>

    <main class="page">

      <div id="errorPanel" class="error-panel"></div>

      <div class="toolbar">
        <div class="search-wrap">
          <input
            id="searchInput"
            class="search"
            type="search"
            placeholder="Search team or manager..."
            autocomplete="off"
          />
        </div>

        <div id="statusLine" class="status-line">
          Loading teams...
        </div>
      </div>

      <div id="content">
        <div class="loading">Loading Eliza Cup teams...</div>
      </div>

      <div class="footer-note">
        Drag teams between divisions or use the Move dropdown on mobile.
      </div>

    </main>
  </div>

  <div id="toast" class="toast"></div>


  <script>
    /***************************************************************
     * ELIZA CUP ADMIN FRONTEND
     ***************************************************************/

    const API_URL =
      'https://script.google.com/macros/s/AKfycbweLNRiMQMu1nMlvKMTsJmur_NrMU688qqWaxzxR2qMMWUVS6FXcuaZvDpfZJoeXdrB/exec';

    const DIVISIONS = [
      {
        key: 'DIVISION 1',
        label: 'Division 1',
        capacity: 14
      },
      {
        key: 'DIVISION 2A',
        label: 'Division 2A',
        capacity: 12
      },
      {
        key: 'DIVISION 2B',
        label: 'Division 2B',
        capacity: 12
      },
      {
        key: 'DIVISION 3A',
        label: 'Division 3A',
        capacity: 12
      },
      {
        key: 'DIVISION 3B',
        label: 'Division 3B',
        capacity: 12
      },
      {
        key: 'WAITLIST',
        label: 'Waitlist',
        capacity: null
      },
      {
        key: 'INFILL',
        label: 'Infill',
        capacity: null,
        fullWidth: true
      }
    ];

    let teams = [];
    let originalTeams = [];
    let undoStack = [];
    let isSaving = false;
    let draggedTeamId = null;

    const content = document.getElementById('content');
    const searchInput = document.getElementById('searchInput');
    const refreshBtn = document.getElementById('refreshBtn');
    const saveBtn = document.getElementById('saveBtn');
    const undoBtn = document.getElementById('undoBtn');
    const discardBtn = document.getElementById('discardBtn');
    const unsavedPill = document.getElementById('unsavedPill');
    const statusLine = document.getElementById('statusLine');
    const errorPanel = document.getElementById('errorPanel');
    const toast = document.getElementById('toast');


    /***************************************************************
     * LOAD
     ***************************************************************/
    async function loadTeams() {
      setError('');
      content.innerHTML =
        '<div class="loading">Loading Eliza Cup teams...</div>';

      statusLine.textContent = 'Loading teams...';

      try {
        const response = await fetch(
          API_URL + '?action=getTeams&_=' + Date.now()
        );

        if (!response.ok) {
          throw new Error(
            'API returned HTTP ' + response.status
          );
        }

        const data = await response.json();

        if (!data.success) {
          throw new Error(
            data.error || 'Unable to load team data.'
          );
        }

        teams = normaliseTeamList(data.teams || []);
        originalTeams = deepClone(teams);
        undoStack = [];

        render();
        updateControls();

        statusLine.textContent =
          teams.length + ' teams loaded';

      } catch (error) {
        console.error(error);

        setError(
          'Could not load the Eliza Cup Admin data. ' +
          'Make sure the Apps Script deployment is set to "Anyone" ' +
          'and that you deployed the latest version. ' +
          'Error: ' + error.message
        );

        content.innerHTML =
          '<div class="loading">Unable to load teams.</div>';

        statusLine.textContent = 'Load failed';
      }
    }


    /***************************************************************
     * NORMALISE
     ***************************************************************/
    function normaliseTeamList(list) {
      return list
        .map(item => ({
          id: String(item.id || '').trim(),
          team: String(item.team || '').trim(),
          manager: String(item.manager || '').trim(),
          division: String(item.division || '').trim(),
          order: Number(item.order) || 999,
          intention: String(item.intention || '').trim(),
          previousDivision:
            String(item.previousDivision || '').trim(),
          overall: String(item.overall || '').trim(),
          comments: String(item.comments || '').trim(),
          contact: String(item.contact || '').trim()
        }))
        .sort(sortTeams);
    }


    /***************************************************************
     * RENDER
     ***************************************************************/
    function render() {
      const query =
        searchInput.value.trim().toLowerCase();

      const wrapper = document.createElement('div');
      wrapper.className = 'division-grid';

      DIVISIONS.forEach(div => {
        const allDivisionTeams = getDivisionTeams(div.key);

        const filteredTeams = allDivisionTeams.filter(team => {
          if (!query) return true;

          const haystack = [
            team.team,
            team.manager,
            team.id,
            team.intention,
            team.previousDivision
          ]
            .join(' ')
            .toLowerCase();

          return haystack.includes(query);
        });

        const card = document.createElement('section');
        card.className =
          'division-card' +
          (div.fullWidth ? ' full-width' : '');

        const overCapacity =
          div.capacity !== null &&
          allDivisionTeams.length > div.capacity;

        const countText =
          div.capacity === null
            ? allDivisionTeams.length
            : allDivisionTeams.length + ' / ' + div.capacity;

        card.innerHTML = `
          <div class="division-header">
            <div class="division-title">
              <h2>${escapeHtml(div.label)}</h2>
              <span class="count-pill ${overCapacity ? 'over' : ''}">
                ${countText}
              </span>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="drag-col"></th>
                  <th>Team</th>
                  <th class="manager-cell">Manager</th>
                  <th class="status-cell">Status</th>
                  <th class="move-cell">Move</th>
                </tr>
              </thead>

              <tbody data-division="${escapeHtml(div.key)}">
                ${buildRows(filteredTeams)}
              </tbody>
            </table>
          </div>
        `;

        wrapper.appendChild(card);
      });

      content.innerHTML = '';
      content.appendChild(wrapper);

      attachDragHandlers();
      attachMoveHandlers();
    }


    function buildRows(list) {
      if (!list.length) {
        return `
          <tr>
            <td colspan="5" class="empty-row">
              No teams
            </td>
          </tr>
        `;
      }

      return list
        .map(team => {
          const displayName =
            team.team || team.manager || 'Unnamed Team';

          return `
            <tr
              draggable="true"
              data-team-id="${escapeHtml(team.id)}"
            >
              <td class="drag-col">
                <span class="drag-handle" title="Drag">
                  ⋮⋮
                </span>
              </td>

              <td class="team-cell">
                <div class="team-name">
                  ${escapeHtml(displayName)}
                </div>

                <div class="team-meta">
                  ${buildMeta(team)}
                </div>
              </td>

              <td class="manager-cell">
                ${escapeHtml(team.manager || '—')}
              </td>

              <td class="status-cell">
                ${buildStatusBadge(team.intention)}
              </td>

              <td class="move-cell">
                <select
                  class="move-select"
                  data-team-id="${escapeHtml(team.id)}"
                >
                  ${buildMoveOptions(team.division)}
                </select>
              </td>
            </tr>
          `;
        })
        .join('');
    }


    function buildMeta(team) {
      const parts = [];

      if (team.id) {
        parts.push('#' + team.id);
      }

      if (team.previousDivision) {
        parts.push('Prev: ' + team.previousDivision);
      }

      if (team.overall) {
        parts.push('Overall: ' + team.overall);
      }

      return escapeHtml(parts.join(' • '));
    }


    function buildStatusBadge(value) {
      if (!value) {
        return '<span class="status-badge">—</span>';
      }

      const upper = value.toUpperCase();

      let css = '';

      if (upper === 'CONFIRMED') {
        css = 'status-confirmed';
      } else if (upper === 'LIKELY') {
        css = 'status-likely';
      } else if (upper === 'UNLIKELY') {
        css = 'status-unlikely';
      }

      return `
        <span class="status-badge ${css}">
          ${escapeHtml(value)}
        </span>
      `;
    }


    function buildMoveOptions(currentDivision) {
      return DIVISIONS
        .map(div => {
          const selected =
            div.key === currentDivision ? 'selected' : '';

          return `
            <option
              value="${escapeHtml(div.key)}"
              ${selected}
            >
              ${escapeHtml(div.label)}
            </option>
          `;
        })
        .join('');
    }


    /***************************************************************
     * DRAG & DROP
     ***************************************************************/
    function attachDragHandlers() {
      document
        .querySelectorAll('tbody tr[data-team-id]')
        .forEach(row => {

          row.addEventListener('dragstart', event => {
            draggedTeamId = row.dataset.teamId;
            row.classList.add('dragging');

            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData(
              'text/plain',
              draggedTeamId
            );
          });

          row.addEventListener('dragend', () => {
            draggedTeamId = null;
            row.classList.remove('dragging');

            document
              .querySelectorAll('tbody')
              .forEach(body =>
                body.classList.remove('drag-over')
              );
          });
        });


      document
        .querySelectorAll('tbody[data-division]')
        .forEach(body => {

          body.addEventListener('dragover', event => {
            event.preventDefault();
            body.classList.add('drag-over');
          });

          body.addEventListener('dragleave', event => {
            if (!body.contains(event.relatedTarget)) {
              body.classList.remove('drag-over');
            }
          });

          body.addEventListener('drop', event => {
            event.preventDefault();
            body.classList.remove('drag-over');

            const teamId =
              draggedTeamId ||
              event.dataTransfer.getData('text/plain');

            const division = body.dataset.division;

            if (!teamId || !division) return;

            const targetRow =
              event.target.closest('tr[data-team-id]');

            const targetTeamId =
              targetRow
                ? targetRow.dataset.teamId
                : null;

            moveTeam(
              teamId,
              division,
              targetTeamId
            );
          });
        });
    }


    /***************************************************************
     * MOVE DROPDOWN
     ***************************************************************/
    function attachMoveHandlers() {
      document
        .querySelectorAll('.move-select')
        .forEach(select => {

          select.addEventListener('change', () => {
            moveTeam(
              select.dataset.teamId,
              select.value,
              null
            );
          });
        });
    }


    /***************************************************************
     * MOVE TEAM
     ***************************************************************/
    function moveTeam(teamId, newDivision, beforeTeamId) {
      const team = teams.find(
        item => item.id === teamId
      );

      if (!team) return;

      const beforeSnapshot = deepClone(teams);

      const oldDivision = team.division;

      if (
        oldDivision === newDivision &&
        !beforeTeamId
      ) {
        return;
      }

      team.division = newDivision;

      const divisionTeams = teams
        .filter(item =>
          item.division === newDivision &&
          item.id !== teamId
        )
        .sort(sortTeams);

      let insertIndex = divisionTeams.length;

      if (beforeTeamId) {
        const foundIndex = divisionTeams.findIndex(
          item => item.id === beforeTeamId
        );

        if (foundIndex !== -1) {
          insertIndex = foundIndex;
        }
      }

      divisionTeams.splice(insertIndex, 0, team);

      divisionTeams.forEach((item, index) => {
        item.order = index + 1;
      });

      if (oldDivision !== newDivision) {
        reindexDivision(oldDivision);
      }

      undoStack.push(beforeSnapshot);

      render();
      updateControls();

      showToast(
        (team.team || team.manager || 'Team') +
        ' moved to ' +
        displayDivision(newDivision)
      );
    }


    function reindexDivision(division) {
      const list = teams
        .filter(team => team.division === division)
        .sort(sortTeams);

      list.forEach((team, index) => {
        team.order = index + 1;
      });
    }


    /***************************************************************
     * UNDO
     ***************************************************************/
    function undoLast() {
      if (!undoStack.length) return;

      teams = undoStack.pop();

      render();
      updateControls();

      showToast('Last move undone');
    }


    /***************************************************************
     * DISCARD
     ***************************************************************/
    function discardChanges() {
      if (!hasChanges()) return;

      const okay = confirm(
        'Discard all unsaved changes?'
      );

      if (!okay) return;

      teams = deepClone(originalTeams);
      undoStack = [];

      render();
      updateControls();

      showToast('Changes discarded');
    }


    /***************************************************************
     * SAVE
     ***************************************************************/
    async function saveChanges() {
      if (!hasChanges() || isSaving) return;

      isSaving = true;
      updateControls();

      statusLine.textContent = 'Saving changes...';

      try {
        const payload = {
          action: 'saveTeams',
          teams: teams.map(team => ({
            id: team.id,
            team: team.team,
            division: team.division,
            order: team.order
          }))
        };

        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(payload)
        });

        /*
         * Apps Script + GitHub Pages can require no-cors for POST.
         * That means the browser cannot directly read the response.
         *
         * We therefore reload the API after the save and verify that
         * the stored division/order state matches what we submitted.
         */

        await sleep(900);

        const verifyResponse = await fetch(
          API_URL + '?action=getTeams&_=' + Date.now()
        );

        const verifyData = await verifyResponse.json();

        if (!verifyData.success) {
          throw new Error(
            verifyData.error || 'Save verification failed.'
          );
        }

        const serverTeams =
          normaliseTeamList(verifyData.teams || []);

        if (!sameDivisionState(teams, serverTeams)) {
          throw new Error(
            'The save request was sent, but the stored team order ' +
            'does not match the portal yet.'
          );
        }

        teams = serverTeams;
        originalTeams = deepClone(serverTeams);
        undoStack = [];

        render();
        updateControls();

        statusLine.textContent =
          teams.length + ' teams loaded';

        showToast(
          'Changes saved successfully',
          'success'
        );

      } catch (error) {
        console.error(error);

        setError(
          'The changes could not be confirmed as saved. ' +
          error.message
        );

        statusLine.textContent = 'Save failed';

        showToast(
          'Save failed',
          'error'
        );

      } finally {
        isSaving = false;
        updateControls();
      }
    }


    /***************************************************************
     * CHECK FOR CHANGES
     ***************************************************************/
    function hasChanges() {
      return !sameDivisionState(
        teams,
        originalTeams
      );
    }


    function sameDivisionState(listA, listB) {
      const a = listA
        .map(team => ({
          id: team.id,
          division: team.division,
          order: Number(team.order)
        }))
        .sort((x, y) =>
          x.id.localeCompare(y.id)
        );

      const b = listB
        .map(team => ({
          id: team.id,
          division: team.division,
          order: Number(team.order)
        }))
        .sort((x, y) =>
          x.id.localeCompare(y.id)
        );

      return JSON.stringify(a) === JSON.stringify(b);
    }


    /***************************************************************
     * CONTROLS
     ***************************************************************/
    function updateControls() {
      const changed = hasChanges();

      saveBtn.disabled =
        !changed || isSaving;

      discardBtn.disabled =
        !changed || isSaving;

      undoBtn.disabled =
        !undoStack.length || isSaving;

      refreshBtn.disabled =
        isSaving;

      unsavedPill.classList.toggle(
        'show',
        changed
      );

      if (changed) {
        const count = countChangedTeams();

        unsavedPill.textContent =
          count +
          (count === 1
            ? ' UNSAVED CHANGE'
            : ' UNSAVED CHANGES');
      }
    }


    function countChangedTeams() {
      const originalMap = {};

      originalTeams.forEach(team => {
        originalMap[team.id] =
          team.division + '|' + team.order;
      });

      return teams.filter(team => {
        return (
          originalMap[team.id] !==
          team.division + '|' + team.order
        );
      }).length;
    }


    /***************************************************************
     * HELPERS
     ***************************************************************/
    function getDivisionTeams(division) {
      return teams
        .filter(team => team.division === division)
        .sort(sortTeams);
    }


    function sortTeams(a, b) {
      const divA = DIVISIONS.findIndex(
        div => div.key === a.division
      );

      const divB = DIVISIONS.findIndex(
        div => div.key === b.division
      );

      if (divA !== divB) {
        return divA - divB;
      }

      const orderA = Number(a.order) || 999;
      const orderB = Number(b.order) || 999;

      if (orderA !== orderB) {
        return orderA - orderB;
      }

      return String(a.team)
        .localeCompare(String(b.team));
    }


    function displayDivision(key) {
      const found = DIVISIONS.find(
        div => div.key === key
      );

      return found ? found.label : key;
    }


    function deepClone(value) {
      return JSON.parse(JSON.stringify(value));
    }


    function sleep(ms) {
      return new Promise(resolve =>
        setTimeout(resolve, ms)
      );
    }


    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }


    function setError(message) {
      if (!message) {
        errorPanel.textContent = '';
        errorPanel.classList.remove('show');
        return;
      }

      errorPanel.textContent = message;
      errorPanel.classList.add('show');
    }


    let toastTimer = null;

    function showToast(message, type = '') {
      clearTimeout(toastTimer);

      toast.textContent = message;
      toast.className = 'toast';

      if (type) {
        toast.classList.add(type);
      }

      requestAnimationFrame(() => {
        toast.classList.add('show');
      });

      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }


    /***************************************************************
     * EVENTS
     ***************************************************************/
    searchInput.addEventListener('input', render);

    refreshBtn.addEventListener('click', () => {
      if (hasChanges()) {
        const okay = confirm(
          'Refresh and discard unsaved changes?'
        );

        if (!okay) return;
      }

      loadTeams();
    });

    undoBtn.addEventListener('click', undoLast);
    discardBtn.addEventListener('click', discardChanges);
    saveBtn.addEventListener('click', saveChanges);

    window.addEventListener('beforeunload', event => {
      if (!hasChanges()) return;

      event.preventDefault();
      event.returnValue = '';
    });


    /***************************************************************
     * START
     ***************************************************************/
    loadTeams();
  </script>
</body>
</html>
